# Уведомления в Telegram, когда расписание (или ДЗ) поменяли вручную и запушили в main.
# ДЗ, записанное ботом из чата, рассылает сам бот домашки (его коммиты этот workflow не запускают).
# «[тихо]» в сообщении коммита — ничего не рассылать.
name: Уведомления (расписание)
on:
  push:
    branches: [main]
    paths: ['schedule.json', 'homework.json']
permissions:
  contents: read
concurrency:
  group: notify
  cancel-in-progress: false
jobs:
  notify:
    if: ${{ !contains(github.event.head_commit.message, '[тихо]') && github.event.before != '0000000000000000000000000000000000000000' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Старые версии файлов
        run: |
          for f in schedule homework; do
            curl -sSfL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.event.before }}/$f.json" -o /tmp/old_$f.json || echo '{}' > /tmp/old_$f.json
          done
      - name: Разослать
        env:
          LOGIN_BOT_TOKEN: ${{ secrets.LOGIN_BOT_TOKEN }}
        run: python3 bot/notify.py --old-sch /tmp/old_schedule.json --old-hw /tmp/old_homework.json
