# Сервер «Зубрёжки» (вход, болталка, «Кто что отвечает») — облачная функция в Яндекс Облаке.
# Обновляется сам при изменениях в папке server/. Доступ к Облаку — без ключей, через федерацию
# (сервисный аккаунт zubrezhka-sa доверяет только ветке main этого репозитория).
# Нужен секрет репозитория LOGIN_BOT_TOKEN (токен бота @zubrezhka_s201_bot); TELEGRAM_BOT_TOKEN уже есть (бот домашки).
name: Сервер (Яндекс Облако)

on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/deploy-server.yml']
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-server
  cancel-in-progress: false

env:
  YC_FOLDER_ID: b1gq4ga3s4rlj26e3d23
  YC_SA_ID: ajejuekrvs6kro23okm0
  YDB_ENDPOINT: grpcs://ydb.serverless.yandexcloud.net:2135/?database=/ru-central1/b1gsqoj9pce8c70okb5o/etn0phfrrctsmf79as6i
  LOGIN_BOT_NAME: zubrezhka_s201_bot

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Проверка кода сервера
        run: |
          pip install -q ydb
          python3 server/test_server.py

      - name: Чат группы из bot/config.json
        id: cfg
        run: echo "chat=$(python3 -c "import json;print(json.load(open('bot/config.json')).get('chat',''))")" >> "$GITHUB_OUTPUT"

      - name: Вход в Облако (GitHub → федерация → IAM-токен)
        id: iam
        run: |
          GH=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://github.com/${GITHUB_REPOSITORY_OWNER}" | python3 -c "import sys,json;print(json.load(sys.stdin)['value'])")
          python3 -c "import sys,json,base64;p=sys.argv[1].split('.')[1];p+='='*(-len(p)%4);c=json.loads(base64.urlsafe_b64decode(p));print('sub:',c['sub'],'| aud:',c['aud'])" "$GH"
          R=$(curl -sS https://auth.yandex.cloud/oauth/token -d grant_type=urn:ietf:params:oauth:grant-type:token-exchange \
              -d requested_token_type=urn:ietf:params:oauth:token-type:access_token -d audience=${YC_SA_ID} \
              -d subject_token_type=urn:ietf:params:oauth:token-type:id_token --data-urlencode subject_token=$GH)
          T=$(echo "$R" | python3 -c "import sys,json;print(json.load(sys.stdin).get('access_token',''))")
          if [ -z "$T" ]; then echo "Ответ Облака: $R"; exit 1; fi
          echo "::add-mask::$T"; echo "token=$T" >> "$GITHUB_OUTPUT"

      - name: Выкладка функции
        id: fn
        uses: yc-actions/yc-sls-function@v5
        with:
          yc-iam-token: ${{ steps.iam.outputs.token }}
          folder-id: ${{ env.YC_FOLDER_ID }}
          function-name: zubrezhka-api
          runtime: python312
          entrypoint: index.handler
          memory: 256Mb
          execution-timeout: '10'
          service-account: ${{ env.YC_SA_ID }}
          source-root: server
          include: |
            index.py
            db.py
            requirements.txt
          environment: |
            YDB_ENDPOINT=${{ env.YDB_ENDPOINT }}
            GROUP_CHAT_ID=${{ steps.cfg.outputs.chat }}
            LOGIN_BOT_NAME=${{ env.LOGIN_BOT_NAME }}
            LOGIN_BOT_TOKEN=${{ secrets.LOGIN_BOT_TOKEN }}
            MAIN_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}

      # Бот входа работает не через вебхук (Telegram не достаёт до Облака), а через bot/login_relay.py в GitHub Actions.
      - name: Адрес сервера
        run: echo "### Адрес сервера https://functions.yandexcloud.net/${{ steps.fn.outputs.function-id }}" >> "$GITHUB_STEP_SUMMARY"
