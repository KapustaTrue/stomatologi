<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';
const q = new URLSearchParams(location.search);
const files = (q.get('f') || '').split(',');
const W = +q.get('w') || 1000, H = +q.get('h') || 800;
// камера: азимут (вокруг вертикали z) и высота, в градусах; BodyParts3D: z — вверх
const az = +(q.get('az') || 0), el = +(q.get('el') || 0), roll = +(q.get('roll') || 0);
const colors = (q.get('c') || '').split(',');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const group = new THREE.Group(); scene.add(group);
const loader = new STLLoader();
const geoms = await Promise.all(files.map(f => loader.loadAsync('stl/' + f + '.stl')));
geoms.forEach((g, i) => {
  g.computeVertexNormals();
  const m = new THREE.MeshStandardMaterial({ color: colors[i] || '#eadfc8', roughness: 0.72, metalness: 0.0 });
  group.add(new THREE.Mesh(g, m));
});
const box = new THREE.Box3().setFromObject(group), c = box.getCenter(new THREE.Vector3()), s = box.getSize(new THREE.Vector3());
group.position.sub(c);
const R = s.length() / 2;
const cam = new THREE.PerspectiveCamera(22, W / H, R * 0.1, R * 20);
const a = THREE.MathUtils.degToRad(az), e = THREE.MathUtils.degToRad(el);
const dir = new THREE.Vector3(Math.cos(e) * Math.sin(a), -Math.cos(e) * Math.cos(a), Math.sin(e));
cam.up.set(0, 0, 1);
const dist = R / Math.sin(THREE.MathUtils.degToRad(11)) * (+q.get('zoom') || 1);
cam.position.copy(dir.clone().multiplyScalar(dist)); cam.lookAt(0, 0, 0);
if (roll) cam.rotateZ(THREE.MathUtils.degToRad(roll));
// свет: мягкий общий + ключевой сверху-спереди + контровой
scene.add(new THREE.HemisphereLight(0xfffaf0, 0x6b5a48, 0.9));
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.copy(dir.clone().multiplyScalar(dist).add(new THREE.Vector3(0, 0, R * 3)).applyAxisAngle(new THREE.Vector3(0,0,1), 0.6)); scene.add(key);
const fill = new THREE.DirectionalLight(0xfff1dd, 0.7); fill.position.copy(dir.clone().multiplyScalar(-dist).add(new THREE.Vector3(0, 0, R))); scene.add(fill);
renderer.render(scene, cam);
// проекция точек (для подписей): ?pts=x,y,z;x,y,z — в координатах модели
window.project = (x, y, z) => { const v = new THREE.Vector3(x, y, z).sub(c).project(cam); return [ (v.x + 1) / 2 * W, (1 - v.y) / 2 * H ]; };
window.bbox = { min: box.min.toArray(), max: box.max.toArray() };
window.done = true;
</script></body></html>
