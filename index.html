<html lang="ru">
<head>
<meta charset="utf-8">

<style>
:root{
  --bg:#f5f4fa; --card:#fff; --ink:#1d2030; --muted:#6a6f82; --line:#e6e4ef;
  --acc:#7b61d6; --acc-soft:#f0ecff; --acc-ink:#46309a;
  --sut:#fdecef; --sut-b:#e0527a; --simple:#e7f6ea; --simple-b:#3f9e5c; --imp:#fff4d9; --imp-b:#e0a000; --fact:#eef3ff; --fact-b:#5b7fd6;
  --r:18px; --shadow:0 1px 2px rgba(20,20,50,.05),0 6px 20px rgba(20,20,50,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.55}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:var(--acc-ink)}
.wrap{max-width:760px;margin:0 auto;padding:0 16px calc(84px + env(safe-area-inset-bottom))}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:rgba(245,244,250,.88);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);padding-top:env(safe-area-inset-top);border-bottom:1px solid transparent}
.top.scrolled{border-bottom-color:var(--line)}
.top-in{max-width:760px;margin:0 auto;padding:10px 12px;display:flex;align-items:center;gap:8px;min-height:56px}
.back{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow);flex:none}
.back svg{width:20px;height:20px}
.top-title{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.icon-btn{height:40px;padding:0 12px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;flex:none}
.icon-btn svg{width:18px;height:18px}
/* home */
.hero{padding:18px 4px 6px}
.hero small{color:var(--muted);font-weight:600;letter-spacing:.02em}
.hero h1{font-size:30px;line-height:1.15;margin:4px 0 6px;font-weight:800;letter-spacing:-.02em}
.hero p{margin:0;color:var(--muted)}
.search{margin:16px 0 8px;position:relative}
.search input{width:100%;height:50px;border-radius:16px;border:1px solid var(--line);background:var(--card);padding:0 16px 0 46px;font:inherit;font-size:16px;color:var(--ink);box-shadow:var(--shadow);outline:none}
.search input:focus{border-color:var(--acc)}
.search svg{position:absolute;left:15px;top:15px;width:20px;height:20px;color:var(--muted)}
.section-label{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:22px 4px 10px}
.continue{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);width:100%;text-align:left}
.continue .em{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;flex:none}
.continue b{display:block;font-size:15px;line-height:1.3}
.continue span{font-size:13px;color:var(--muted)}
.subjects{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.subjects{grid-template-columns:1fr}}
.subj{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);text-align:left;display:flex;flex-direction:column;gap:10px;min-height:150px;position:relative;overflow:hidden;transition:transform .15s}
.subj:active{transform:scale(.98)}
.subj .em{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px}
.subj h3{margin:0;font-size:17px;line-height:1.25;font-weight:700}
.subj .teacher{font-size:13px;color:var(--muted);line-height:1.3;margin-top:-4px}
.subj-head p.t{margin:0 0 4px;opacity:1}
.lec-head p.lt{margin-top:6px;font-size:13px}
.subj .meta{margin-top:auto;font-size:13px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.subj .bar{position:absolute;left:0;right:0;bottom:0;height:4px}
.install{margin-top:22px;width:100%;display:flex;gap:12px;align-items:center;padding:14px;border-radius:var(--r);background:linear-gradient(135deg,#ece8ff,#e3efff);text-align:left}
.install .em{font-size:24px}
.install b{display:block;font-size:15px}
.install span{font-size:13px;color:var(--muted)}
/* subject page */
.subj-head{border-radius:24px;padding:20px;margin:6px 0 16px;color:#fff;position:relative;overflow:hidden}
.subj-head .em{font-size:38px;line-height:1}
.subj-head h1{margin:10px 0 4px;font-size:24px;line-height:1.2;font-weight:800}
.subj-head p{margin:0;opacity:.9;font-size:14px}
.lec{display:flex;gap:14px;align-items:center;background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);width:100%;text-align:left;margin-bottom:10px}
.lec .n{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-weight:800;font-size:17px;flex:none}
.lec b{display:block;font-size:16px;line-height:1.3}
.lec span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.lec .prog{font-size:12px;font-weight:600;margin-top:6px;display:flex;gap:10px}
.lec.soon{opacity:.55;box-shadow:none;border:1px dashed var(--line);background:transparent;cursor:default}
.chev{margin-left:auto;color:#b6b9c8;flex:none}
/* lecture */
.lec-head{padding:6px 4px 4px}
.lec-head .kicker{font-size:13px;font-weight:700;color:var(--acc)}
.lec-head h1{margin:4px 0 6px;font-size:26px;line-height:1.2;font-weight:800;letter-spacing:-.01em}
.lec-head p{margin:0;color:var(--muted);font-size:14px}
.tabs{position:sticky;top:calc(56px + env(safe-area-inset-top));z-index:15;display:flex;gap:6px;padding:10px 0;background:var(--bg)}
.tab{flex:1;height:42px;border-radius:13px;font-weight:600;font-size:14px;background:var(--card);box-shadow:var(--shadow);color:var(--muted)}
.tab.on{background:var(--acc);color:#fff}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 6px}
.chip{height:38px;padding:0 14px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:7px}
.chip svg{width:17px;height:17px}
.toc{background:var(--card);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow);margin:12px 0}
.toc summary{font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
.toc summary::-webkit-details-marker{display:none}
.toc ol{margin:10px 0 2px;padding-left:22px}
.toc li{margin:4px 0}
.toc a{color:var(--ink);text-decoration:none}
.sec{background:var(--card);border-radius:var(--r);padding:18px 16px;box-shadow:var(--shadow);margin:12px 0;scroll-margin-top:130px}
.sec h2{margin:0 0 12px;font-size:20px;line-height:1.25;display:flex;gap:10px;align-items:baseline}
.sec h2 .num{color:var(--acc);font-weight:800}
.sec p{margin:10px 0}
.sec ul,.sec ol{padding-left:22px;margin:10px 0}
.sec li{margin:6px 0}
.box{border-radius:14px;padding:12px 14px;margin:12px 0;border-left:4px solid}
.box .tag{display:block;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.box.sut{background:var(--sut);border-color:var(--sut-b)} .box.sut .tag{color:#b2244f}
.box.simple{background:var(--simple);border-color:var(--simple-b)} .box.simple .tag{color:#22663a}
.box.imp{background:var(--imp);border-color:var(--imp-b)} .box.imp .tag{color:#8a6200}
.box.fact{background:var(--fact);border-color:var(--fact-b)} .box.fact .tag{color:#2c4fa3}
.note{font-size:13px;color:var(--muted);background:#f6f6f9;border-radius:10px;padding:8px 12px;margin:10px 0}
.tbl{overflow-x:auto;margin:12px -4px;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:14.5px;line-height:1.4}
th{background:var(--acc-soft);color:var(--acc-ink);text-align:left;font-weight:700;padding:9px 10px}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere;hyphens:auto}
th:first-child{border-radius:10px 0 0 0} th:last-child{border-radius:0 10px 0 0}
figure{margin:14px 0;text-align:center}
figure svg{max-width:100%;height:auto}
figcaption{font-size:13px;color:var(--muted);margin-top:6px}
.remember{background:linear-gradient(160deg,#fff7d6,#fff1c2);border-radius:var(--r);padding:18px 16px;margin:16px 0}
.remember h2{margin:0 0 8px;font-size:20px}
.remember li{margin:8px 0}
.facts .box{margin:10px 0}
.outlink{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);margin:12px 0;text-decoration:none;color:var(--ink)}
.outlink b{display:block}
.outlink span{font-size:13px;color:var(--muted)}
/* flashcards */
.fc-wrap{margin:10px 0}
.fc{position:relative;height:280px;cursor:pointer;user-select:none;-webkit-user-select:none}
.face{position:absolute;inset:0;border-radius:22px;padding:24px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;box-shadow:var(--shadow);transition:opacity .25s,transform .25s}
.face.ffront{background:var(--card)}
.face.fback{background:var(--acc);color:#fff;opacity:0;transform:scale(.96);pointer-events:none}
.fc.flip .face.ffront{opacity:0;transform:scale(.96)}
.fc.flip .face.fback{opacity:1;transform:none}
.face .lbl{position:absolute;top:16px;left:18px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;opacity:.6}
.face .txt{font-size:21px;font-weight:700;line-height:1.35}
.face.fback .txt{font-size:19px;font-weight:600}
.face .hint{position:absolute;bottom:14px;font-size:12px;opacity:.55}
.fc-ctrl{display:flex;gap:10px;margin-top:12px}
.fc-ctrl button{flex:1;height:52px;border-radius:15px;font-weight:700;font-size:15px}
.btn-no{background:#ffe6e6;color:#a82424}
.btn-yes{background:#dff4e4;color:#1f6a37}
.fc-top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted);font-weight:600;margin-top:8px}
.pbar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0}
.pbar i{display:block;height:100%;background:var(--acc);border-radius:6px;transition:width .3s}
.link-btn{color:var(--acc-ink);font-weight:600;font-size:14px;padding:6px 0}
.done{text-align:center;background:var(--card);border-radius:22px;padding:28px 20px;box-shadow:var(--shadow);margin:12px 0}
.done .big{font-size:44px}
.done h3{margin:8px 0 4px;font-size:21px}
.done p{color:var(--muted);margin:0 0 16px}
.primary{height:50px;padding:0 22px;border-radius:15px;background:var(--acc);color:#fff;font-weight:700;font-size:15px}
.secondary{height:50px;padding:0 22px;border-radius:15px;background:var(--acc-soft);color:var(--acc-ink);font-weight:700;font-size:15px}
/* quiz */
.q-card{background:var(--card);border-radius:22px;padding:20px 16px;box-shadow:var(--shadow);margin:10px 0}
.q-card h3{margin:4px 0 14px;font-size:19px;line-height:1.35}
.opt{display:block;width:100%;text-align:left;padding:14px 16px;border-radius:14px;border:2px solid var(--line);margin:8px 0;font-size:15.5px;font-weight:500;background:#fff;transition:background .15s,border-color .15s}
.opt.right{border-color:#3f9e5c;background:#e7f6ea}
.opt.wrong{border-color:#d64545;background:#fdeaea}
.opt:disabled{cursor:default}
.why{border-radius:14px;padding:12px 14px;margin-top:12px;font-size:15px}
.why.ok{background:#e7f6ea} .why.bad{background:#fdeaea}
/* search results */
.res{display:block;width:100%;text-align:left;background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);margin-bottom:8px}
.res small{font-size:12px;font-weight:700}
.res b{display:block;font-size:15px;margin:2px 0}
.res span{font-size:13.5px;color:var(--muted);display:block}
mark{background:#ffe58a;color:inherit;border-radius:3px;padding:0 1px}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
/* sheet / modal */
.scrim{position:fixed;inset:0;background:rgba(20,20,40,.35);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;animation:up .25s cubic-bezier(.3,.7,.3,1)}
@media(min-width:600px){.scrim{align-items:center}.sheet{border-radius:24px}}
.sheet h3{margin:0 0 6px;font-size:20px}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:-6px auto 14px}
.sheet .os{background:var(--bg);border-radius:16px;padding:14px;margin:12px 0}
.sheet .os b{display:block;margin-bottom:6px}
.sheet ol{margin:0;padding-left:20px}
.sheet li{margin:5px 0}
@keyframes fade{from{opacity:0}} @keyframes up{from{transform:translateY(30px);opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1d2030;color:#fff;padding:11px 18px;border-radius:14px;font-size:14px;font-weight:600;z-index:60;max-width:90vw;text-align:center;animation:up .2s}
.quick-btn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin-top:14px;padding:14px 16px;border-radius:var(--r);background:linear-gradient(135deg,#ffcf3f,#ff9d2e);color:#3a2300;box-shadow:0 6px 18px rgba(255,157,46,.35)}
.quick-btn .qi{font-size:28px;line-height:1}
.quick-btn b{display:block;font-size:17px}
.quick-btn span{font-size:13px;opacity:.85}
.quick-btn .chev{color:#7a4b00;margin-left:auto}
.quick-head{padding:8px 4px 0}
.quick-head h1{margin:4px 0 4px;font-size:26px;font-weight:800}
.quick-head p{margin:0;color:var(--muted);font-size:14px}
.quick-search input{height:56px;font-size:18px;border-width:2px}
.qchips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 6px;-webkit-overflow-scrolling:touch}
.qchip{flex:none;height:36px;padding:0 14px;border-radius:18px;background:var(--card);box-shadow:var(--shadow);font-size:14px;font-weight:600;color:var(--muted)}
.qchip.on{background:#1d2030;color:#fff}
.qbest{background:var(--card);border-radius:22px;padding:18px 16px;box-shadow:var(--shadow);border-top:5px solid var(--c);margin:10px 0}
.qsrc{font-size:12px;font-weight:700;color:var(--muted)}
.qq{font-size:15px;font-weight:700;color:var(--muted);margin:6px 0 8px}
.qbest .qa{font-size:19px;line-height:1.5;font-weight:500}
.qalt .qa{font-size:16px;line-height:1.5;margin:8px 0}
.qmore{margin-top:10px;font-size:14px;color:var(--muted)} .qmore summary{cursor:pointer;font-weight:600;color:var(--ink)}
.qopen{margin-top:12px;font-size:14px;font-weight:700;color:var(--acc-ink);padding:4px 0}
.qalt{background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);margin-bottom:8px}
.qalt summary{cursor:pointer;list-style:none} .qalt summary::-webkit-details-marker{display:none}
.qalt small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.qalt b{display:block;font-size:15px;margin-top:2px}
.qtips{background:var(--card);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow);margin-top:10px;font-size:15px}
.qtips ul{margin:8px 0 0;padding-left:20px} .qtips li{margin:5px 0}
.mode{display:flex;background:var(--card);border-radius:14px;padding:4px;box-shadow:var(--shadow);margin:6px 0 4px}
.mode button{flex:1;height:40px;border-radius:11px;font-weight:700;font-size:14px;color:var(--muted)}
.mode button.on{background:var(--acc-soft);color:var(--acc-ink)}
.pages{display:flex;flex-direction:column;gap:12px;margin:10px 0}
.pg{display:block;border-radius:12px;overflow:hidden;box-shadow:var(--shadow);background:#fff}
.pg img{display:block;width:100%;height:auto}
.pcount{font-size:13px;color:var(--muted);align-self:center}
.fullcard{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,var(--acc-soft),#fff);border-radius:var(--r);padding:18px 16px;box-shadow:var(--shadow);margin:12px 0;text-decoration:none;color:var(--ink)}
.fullcard .big{font-size:34px} .fullcard b{display:block;font-size:17px} .fullcard span{font-size:13px;color:var(--muted)}
/* навигация в полной версии */
.navrow{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.navrow button{height:46px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px}
.navrow svg{width:17px;height:17px}
@media (min-width:600px){.navrow{grid-template-columns:repeat(4,1fr)}}
.fab-top{position:fixed;right:max(16px, env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom));z-index:25;width:48px;height:48px;border-radius:16px;background:#1d2030;color:#fff;font-size:22px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.22);opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .2s,transform .2s}
.fab-top.show{opacity:1;transform:none;pointer-events:auto}
/* просмотр страницы */
html.vw-open,html.vw-open body{overflow:hidden}
html.vw-open .fab-top{display:none}
.viewer{position:fixed;inset:0;z-index:100;background:#14161f;display:flex;flex-direction:column;color:#fff}
.vw-top,.vw-bot{flex:none;display:flex;align-items:center;gap:8px;padding:10px 12px;background:#1d2030}
.vw-top{padding-top:calc(10px + env(safe-area-inset-top))}
.vw-bot{padding-bottom:calc(10px + env(safe-area-inset-bottom));justify-content:space-between}
.vw-title{flex:1;min-width:0;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.8}
.vw-btn{height:42px;min-width:42px;padding:0 12px;border-radius:12px;background:rgba(255,255,255,.12);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:4px;flex:none}
.vw-btn svg{width:19px;height:19px}
.vw-btn:disabled{opacity:.3;cursor:default}
.vw-count{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.vw-stage{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;display:flex;align-items:flex-start;justify-content:center;padding:10px}
.vw-stage img{display:block;width:100%;max-width:900px;height:auto;margin:auto;border-radius:6px;background:#fff}
.viewer.zoomed .vw-stage{display:block}
.viewer.zoomed .vw-stage img{width:200%;max-width:none}
.foot{text-align:center;color:var(--muted);font-size:12.5px;margin-top:30px}
</style>

<body>
<header class="top" id="top"><div class="top-in" id="topIn"></div></header>
<main class="wrap" id="app"></main>
<script>
// ===== МЕДИЦИНСКАЯ ГЕНЕТИКА =====
// Блоки: ['h',заголовок] ['sut',текст] ['p',html] ['ul',[...]] ['ol',[...]] ['simple',текст] ['imp',текст] ['fact',текст] ['table',[шапка],[[строки]]] ['svg',ключ,подпись] ['note',текст]

const GEN = {
  id: 'genetics', name: 'Медицинская генетика', short: 'Медгенетика',
  color: '#7b61d6', soft: '#f0ecff', ink: '#46309a', emoji: '🧬',
  teacher: 'Шук Несса Николаевна',
  lectures: [
  {
    id: 'gen-1', num: 1, title: 'Цитологические основы наследственности',
    sub: 'Клетка, хромосомы, кариотип, митоз, мейоз, гаметогенез',
    date: '3 ноября',

/* ---------- render helpers ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const strip = s => String(s).replace(/<[^>]+>/g,'');
function blockHTML(b){
  const [t,a,c] = b;
  switch(t){
    case 'sut': return `<div class="box sut"><span class="tag">Суть</span>${a}</div>`;
    case 'simple': return `<div class="box simple"><span class="tag">Простыми словами</span>${a}</div>`;
    case 'imp': return `<div class="box imp"><span class="tag">Важно</span>${a}</div>`;
    case 'fact': return `<div class="box fact"><span class="tag">Интересно</span>${a}</div>`;
    case 'note': return `<div class="note">ⓘ ${a}</div>`;
    case 'p': return `<p>${a}</p>`;
    case 'h': return `<h3>${a}</h3>`;
    case 'ul': return `<ul>${a.map(x=>`<li>${x}</li>`).join('')}</ul>`;
    case 'ol': return `<ol>${a.map(x=>`<li>${x}</li>`).join('')}</ol>`;
    case 'table': return `<div class="tbl"><table><thead><tr>${a.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${c.map(r=>`<tr>${r.map(d=>`<td>${d}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    case 'svg': return `<figure>${SVGS[a]||''}<figcaption>${c||''}</figcaption></figure>`;
  }
  return '';
}
function blockText(b){
  const [t,a,c] = b;
  if (t==='ul'||t==='ol') return a.map(strip).join(' ');
  if (t==='table') return a.join(' ') + ' ' + c.map(r=>r.join(' ')).join(' ');
  if (t==='svg') return c||'';
  return strip(a);
}
function setAccent(s){

const STOP = new Set('что такое это как какие какой какая каков назовите назови перечислите перечисли расскажите расскажи опишите опиши объясните объясни дайте дай в во и на по для о об из у к с со чем где когда зачем почему ли кто сколько его её их а но или же бы при от до за под над про это этот эта эти то тот та те вопрос ответ определение понятие'.split(' '));
const SYN = { 'прививк':'вакцин', 'привив':'вакцин', 'укол':'вакцин', 'иммунизац':'вакцин', 'деление':'митоз', 'делени':'митоз', 'кариотип':'кариотип', 'ген':'ген', 'наследован':'наследств', 'наследствен':'наследств', 'менделя':'мендел', 'закон':'закон', 'перелом':'перелом', 'кост':'кост', 'позвонк':'позвоночн', 'ребр':'ребр', 'рёбр':'ребр', 'днк':'днк', 'рнк':'рнк', 'белок':'белк', 'белк':'белк', 'синтез':'синтез', 'копирован':'репликац', 'удвоен':'репликац', 'ремонт':'репарац', 'исправлен':'репарац' };
const ENDS = ['иями','ями','ами','ией','ого','его','ому','ему','ыми','ими','ость','ости','ий','ый','ой','ая','яя','ое','ее','ие','ые','ию','ия','ья','ах','ях','ам','ям','ов','ев','ом','ем','ей','ую','юю','ы','и','а','я','о','е','у','ю','ь','й'];
function stem(w){
  w = w.replace(/ё/g,'е');
  if (w.length <= 3) return w;
  for (const e of ENDS){ if (w.length - e.length >= 3 && w.endsWith(e)) { w = w.slice(0, -e.length); break; } }
  return w;
}
function toks(s){
  return String(s).toLowerCase().replace(/<[^>]+>/g,' ').replace(/ё/g,'е').split(/[^a-zа-я0-9ⁿ]+/i).filter(Boolean);
}
function qtoks(s){
  const out = [];
  toks(s).forEach(t => { if (STOP.has(t)) return; let st = stem(t); for (const k in SYN){ if (st.startsWith(k)) { out.push(SYN[k]); break; } } out.push(st); });
  return [...new Set(out)];
}
let QIDX = null;
function buildIndex(){
  const items = [];
  Object.values(LEC).forEach(l => {
    if (l.soon) return;
    (ORAL[l.id]||[]).forEach(([q,a,kw]) => items.push({ l, kind:'oral', q, a, kw: kw||'' , w:1.5 }));
    (l.cards||[]).forEach(([q,a]) => items.push({ l, kind:'card', q, a, kw:'', w:1 }));
    (l.quiz||[]).forEach(z => items.push({ l, kind:'quiz', q: z.q, a: z.o[z.a] + '. ' + z.why, kw:'', w:.8 }));
    (l.sections||[]).forEach((s,si) => {
      const sut = (s.blocks.find(b=>b[0]==='sut')||[])[1] || '';
      const body = s.blocks.filter(b=>['p','ul','ol','table','imp'].includes(b[0])).map(blockText).join(' ');
      items.push({ l, kind:'sec', si, q: s.title, a: sut, more: body, kw:'', w:.9 });
    });
  });
  items.forEach(it => {
    it.qt = toks(it.q + ' ' + it.kw).filter(t=>!STOP.has(t)).map(stem);
    it.at = toks(it.a + ' ' + (it.more||'')).filter(t=>!STOP.has(t)).map(stem);
  });
  const df = {}; items.forEach(it => new Set([...it.qt, ...it.at]).forEach(t => df[t] = (df[t]||0)+1));
  QIDX = { items, df, N: items.length };
}
function tokMatch(qt, list){
  let best = 0;
  for (const d of list){
    if (d === qt) return 1;
    const m = Math.min(qt.length, d.length);
    if (m >= 3 && (d.startsWith(qt) || qt.startsWith(d))) best = Math.max(best, m >= 5 ? .85 : .6);
  }
  return best;
}
function answerSearch(query, subj){
  if (!QIDX) buildIndex();
  const qs = qtoks(query); if (!qs.length) return [];
  const res = [];
  for (const it of QIDX.items){
    if (subj && it.l.subject.id !== subj) continue;
    let sc = 0, hit = 0;
    for (const t of qs){
      const idf = Math.log(1 + QIDX.N / ((QIDX.df[t]||0) + 1));
      const mq = tokMatch(t, it.qt), ma = tokMatch(t, it.at);
      const m = Math.max(mq * 2.2, ma);
      if (m > 0){ hit++; sc += m * idf; }
    }
    if (!hit) continue;
    sc = sc * it.w * (hit / qs.length) * (hit === qs.length ? 1.4 : 1);
    res.push({ it, sc });
  }
  res.sort((x,y) => y.sc - x.sc);
  const seen = new Set(), out = [];
  const topSc = res.length ? res[0].sc : 0;
  for (const r of res){ if (r.sc < topSc * 0.3) break; const k = strip(r.it.a).slice(0,60); if (seen.has(k)) continue; seen.add(k); out.push(r); if (out.length >= 8) break; }
  return out;
}

function doSearch(raw){

      const inT = s.title.toLowerCase().includes(q), idx = text.toLowerCase().indexOf(q);
      if (inT || idx>=0){
        const from = Math.max(0, idx-50);
        hits.push({l, si, title:s.title, text: idx>=0 ? (from?'…':'')+text.slice(from, idx+q.length+80)+'…' : text.slice(0,120)+'…', score: inT?2:1});

  hits.sort((a,b)=>b.score-a.score);
  const hl = s => esc(s).replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'), m=>`<mark>${m}</mark>`);

}

}

/* просмотр страниц полной версии: внутри приложения, с кнопками назад / главная / листание */
let VW = null;
function openViewer(dir, n, i, title){
  if (VW) return;
  const el = document.createElement('div');
  el.className = 'viewer'; el.setAttribute('role','dialog'); el.setAttribute('aria-modal','true');
  el.innerHTML = `
    <div class="vw-top">
      <button class="vw-btn" data-vw="close" aria-label="Назад">${I.back}<span>Назад</span></button>
      <div class="vw-title">${esc(title)}</div>
      <button class="vw-btn" data-vw="zoom" aria-label="Увеличить">🔍</button>
      <button class="vw-btn" data-vw="home" aria-label="Главная">${I.home}</button>
    </div>
    <div class="vw-stage"><img alt=""></div>
    <div class="vw-bot">
      <button class="vw-btn" data-vw="prev" aria-label="Предыдущая страница">‹ Пред.</button>
      <span class="vw-count"></span>
      <button class="vw-btn" data-vw="next" aria-label="Следующая страница">След. ›</button>
    </div>`;
  document.body.appendChild(el);
  document.documentElement.classList.add('vw-open');
  VW = { el, dir, n:+n, i:+i, zoom:false, after:null };
  history.pushState({vw:1}, '');
  const stage = el.querySelector('.vw-stage');
  let sx=0, sy=0, multi=false, lastTap=0;
  stage.addEventListener('touchstart', e => { multi = e.touches.length>1; sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive:true});
  stage.addEventListener('touchend', e => {
    if (multi || !VW || VW.zoom) return;
    const t = e.changedTouches[0], dx = t.clientX-sx, dy = t.clientY-sy;
    if (Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.5) vwStep(dx<0?1:-1);
    else if (Math.abs(dx)<10 && Math.abs(dy)<10){ const now = Date.now(); if (now-lastTap<300) vwZoom(); lastTap = now; }
  }, {passive:true});
  stage.addEventListener('dblclick', vwZoom);
  vwDraw();
}
function vwDraw(){
  const {el, dir, n, i} = VW, p = String(i).padStart(2,'0');
  const img = el.querySelector('.vw-stage img');
  img.src = `${dir}/${p}.webp`; img.alt = `Страница ${i}`;
  el.querySelector('.vw-count').textContent = `${i} / ${n}`;
  el.querySelector('[data-vw="prev"]').disabled = i<=1;
  el.querySelector('[data-vw="next"]').disabled = i>=n;
  el.querySelector('.vw-stage').scrollTo(0,0);
  if (i<n){ const pre = new Image(); pre.src = `${dir}/${String(i+1).padStart(2,'0')}.webp`; }
}
function vwStep(d){ if (!VW) return; const j = VW.i+d; if (j<1 || j>VW.n) return; VW.i = j; vwDraw(); }
function vwZoom(){ if (!VW) return; VW.zoom = !VW.zoom; VW.el.classList.toggle('zoomed', VW.zoom); }
function vwRemove(){
  if (!VW) return;
  const {el, dir, i, after} = VW; VW = null;
  el.remove(); document.documentElement.classList.remove('vw-open');
  if (after!=null) go(after);
  else { const pg = document.querySelector(`.pg[data-vdir="${dir}"][data-vi="${i}"]`); if (pg) pg.scrollIntoView({block:'center'}); }
}
function closeViewer(after){
  if (!VW) return;
  if (after!=null) VW.after = after;
  if (history.state && history.state.vw) history.back(); else vwRemove();
}
window.addEventListener('popstate', () => { if (VW) vwRemove(); });
document.addEventListener('keydown', e => {
  if (!VW) return;
  if (e.key==='Escape') closeViewer();
  else if (e.key==='ArrowRight') vwStep(1);
  else if (e.key==='ArrowLeft') vwStep(-1);
});
function openFile(url, name){
  const a = document.createElement('a'); a.href = url; a.download = name; a.target = '_blank'; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove(); toast('Открываю PDF…');
}

/* flashcards */
function renderCards(l, pane, mode){
  const allKnown = store.get('known',{});
  const known = new Set(allKnown[l.id]||[]);
  let order = l.cards.map((_,i)=>i);
  if (mode==='unknown') order = order.filter(i=>!known.has(i));
  if (!order.length) order = l.cards.map((_,i)=>i);
  for (let i=order.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [order[i],order[j]]=[order[j],order[i]]; }
  let pos = 0, right = 0;
  const save = () => { const a = store.get('known',{}); a[l.id] = [...known]; store.set('known', a); };
  const draw = () => {
    if (pos >= order.length){
      pane.innerHTML = `<div class="done"><div class="big">${right===order.length?'🏆':'💪'}</div><h3>Круг пройден!</h3>
        <p>Знаешь ${known.size} из ${l.cards.length} карточек</p>
        <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        ${known.size<l.cards.length?`<button class="primary" data-act="cards-unknown">Повторить невыученные</button>`:''}
        <button class="secondary" data-act="cards-all">Все заново</button></div></div>`;
      return;
    }
    const i = order[pos], c = l.cards[i];
    pane.innerHTML = `
      <div class="fc-top"><span>Карточка ${pos+1} из ${order.length}</span><span>✅ знаю: ${known.size}/${l.cards.length}</span></div>
      <div class="pbar"><i style="width:${pos/order.length*100}%"></i></div>
      <div class="fc-wrap"><div class="fc" id="fc">
        <div class="face ffront"><span class="lbl">Вопрос</span><div class="txt">${c[0]}</div><span class="hint">нажми, чтобы перевернуть</span></div>
        <div class="face fback"><span class="lbl">Ответ</span><div class="txt">${c[1]}</div></div>
      </div></div>
      <div class="fc-ctrl"><button class="btn-no" id="no">🔁 Ещё учить</button><button class="btn-yes" id="yes">✅ Знаю</button></div>
      <div style="text-align:center;margin-top:8px"><button class="link-btn" data-act="cards-reset">Сбросить прогресс</button></div>`;
    $('#fc').onclick = () => $('#fc').classList.toggle('flip');
    $('#yes').onclick = () => { known.add(i); right++; save(); pos++; draw(); };
    $('#no').onclick = () => { known.delete(i); save(); pos++; draw(); };
  };
  pane._redraw = (m) => renderCards(l, pane, m);
  draw();
}

/* quiz */
function renderQuiz(l, pane){
  const qs = l.quiz; let pos = 0, score = 0;
  const draw = () => {
    if (pos >= qs.length){
      const best = store.get('best',{}); if (best[l.id]==null || score>best[l.id]){ best[l.id]=score; store.set('best',best); }
      const pct = score/qs.length;
      pane.innerHTML = `<div class="done"><div class="big">${pct===1?'🏆':pct>=.6?'👍':'📚'}</div><h3>${score} из ${qs.length}</h3>
        <p>${pct===1?'Идеально! Ты готов.':pct>=.6?'Хорошо! Пару тем стоит повторить.':'Повтори конспект и попробуй ещё раз.'}</p>
        <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="primary" data-act="quiz-again">Пройти ещё раз</button><button class="secondary" data-tab="notes">К конспекту</button></div></div>`;
      return;
    }
    const q = qs[pos];
    pane.innerHTML = `
      <div class="fc-top"><span>Вопрос ${pos+1} из ${qs.length}</span><span>правильно: ${score}</span></div>
      <div class="pbar"><i style="width:${pos/qs.length*100}%"></i></div>
      <div class="q-card"><h3>${q.q}</h3>${q.o.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('')}<div id="why"></div></div>`;
    pane.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      const i = +b.dataset.i, ok = i===q.a; if (ok) score++;
      pane.querySelectorAll('.opt').forEach(x => { x.disabled = true; const xi=+x.dataset.i; if (xi===q.a) x.classList.add('right'); else if (xi===i) x.classList.add('wrong'); });
      $('#why').innerHTML = `<div class="why ${ok?'ok':'bad'}"><b>${ok?'Верно!':'Не совсем.'}</b> ${q.why}</div>
        <button class="primary" style="width:100%;margin-top:12px" id="next">${pos+1<qs.length?'Дальше →':'Результат'}</button>`;
      $('#next').onclick = () => { pos++; draw(); window.scrollTo({top:0}); };
    });
  };
  draw();
}

function plainText(l){

    else if (b[0]==='table') { t += b[1].join(' | ')+'\n'; b[2].forEach(r=>t+=r.join(' | ')+'\n'); }
    else if (b[0]!=='svg') t += pre + strip(b[1]) + '\n';
  }); t += '\n'; });
  t += 'Что запомнить:\n' + l.remember.map(r=>'• '+strip(r)).join('\n');

}
let downloadsNS = null;
try { if (window.claude && window.claude.use) window.claude.use('downloads').then(d => { downloadsNS = d; }).catch(()=>{}); } catch(e){}
async function getDownloads(){
  if (downloadsNS || !window.claude) return downloadsNS;
  try{ if (window.claude && window.claude.use){ downloadsNS = await Promise.race([window.claude.use('downloads'), new Promise(r=>setTimeout(()=>r(null),4000))]); } }catch(e){}
  return downloadsNS;
}
async function doDownload(l){
  await getDownloads();
  const base = `${l.subject.short} — ${l.num}. ${l.title}`;
  const pdfUrl = 'pdf/' + l.id + '.pdf';
  if (downloadsNS){
    let data = null, name = base + '.pdf';
    try { const r = await fetch(pdfUrl); if (r.ok) data = await r.blob(); } catch(e){}
    if (!data){ data = printableHTML(l); name = base + '.html'; }
    try { await downloadsNS.save({ filename: name, data }); toast(name.endsWith('.pdf') ? 'PDF сохранён — можно печатать 🖨' : 'Файл сохранён. Открой его и нажми «Распечатать»'); return; }
    catch(e){ if (e && (e.code==='declined' || e.code==='rate_limited')) return; }
  }
  if (!window.claude){ // обычный сайт
    const a = document.createElement('a'); a.href = pdfUrl; a.download = base + '.pdf'; a.target = '_blank'; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove(); toast('Открываю PDF…'); return;
  }
  showPrintFallback(l);
}

}
async function doCopy(l){

}

  const sc = document.createElement('div'); sc.className='scrim'; sc.id='scrim';
  sc.innerHTML = `<div class="sheet"><div class="grab"></div>${html}<button class="secondary" style="width:100%;margin-top:14px" data-act="close">Закрыть</button></div>`;
  sc.addEventListener('click', e => { if (e.target===sc) closeSheet(); });
  document.body.appendChild(sc);
}
function closeSheet(){ const s=$('#scrim'); if (s) s.remove(); }
function installSheet(){
  openSheet(`<h3>📲 Поставить на экран телефона</h3>
    <p style="color:var(--muted);margin:0">Иконка появится рядом с другими приложениями.</p>
    <div class="os"><b>iPhone (Safari)</b><ol><li>Открой эту страницу в <b>Safari</b>.</li><li>Нажми кнопку «Поделиться» <b>⬆︎</b> внизу экрана.</li><li>Выбери «<b>На экран „Домой“</b>» → «Добавить».</li></ol></div>
    <div class="os"><b>Android (Chrome)</b><ol><li>Открой страницу в <b>Chrome</b>.</li><li>Нажми меню <b>⋮</b> справа вверху.</li><li>Выбери «<b>Добавить на главный экран</b>» или «Установить приложение».</li></ol></div>
    <div class="os"><b>Компьютер</b><ol><li>Просто сохрани страницу в закладки.</li></ol></div>`);
}

/* ---------- routing ---------- */
function route(){
  closeSheet();
  const h = (location.hash||'').slice(1);
  let secIdx = null;
  if (pendingSec!=null){ secIdx = pendingSec; pendingSec = null; }
  if (h === 'otvet') viewQuick();
  else if (h.startsWith('s-') && SUBJ[h.slice(2)]) viewSubject(SUBJ[h.slice(2)]);
  else if (LEC[h] && !LEC[h].soon) viewLecture(LEC[h], secIdx);
  else viewHome();
  if (secIdx==null || secIdx<0) window.scrollTo(0,0);
}
let pendingSec = null;
function go(h){
  if (('#'+h)===location.hash || (!h && !location.hash)) route();
  else location.hash = h;
}
window.addEventListener('hashchange', route);
const fabTop = document.createElement('button');
fabTop.className = 'fab-top'; fabTop.dataset.act = 'totop'; fabTop.setAttribute('aria-label','Наверх'); fabTop.textContent = '↑';
document.body.appendChild(fabTop);
window.addEventListener('scroll', () => {
  top.classList.toggle('scrolled', window.scrollY>4);
  fabTop.classList.toggle('show', window.scrollY>900);
}, {passive:true});

document.addEventListener('click', e => {
  const vb = e.target.closest('[data-vw]');
  if (vb){ const a = vb.dataset.vw;
    if (a==='close') closeViewer(); else if (a==='home') closeViewer(''); else if (a==='zoom') vwZoom();
    else if (a==='prev') vwStep(-1); else if (a==='next') vwStep(1);
    return; }
  const pg = e.target.closest('a.pg[data-vdir]');
  if (pg){ e.preventDefault(); openViewer(pg.dataset.vdir, pg.dataset.vn, pg.dataset.vi, pg.dataset.vt); return; }
  if (e.target.closest('[data-act="totop"]')){ window.scrollTo({top:0, behavior:'smooth'}); return; }
  const md = e.target.closest('[data-mode]');
  if (md){ noteMode = md.dataset.mode; store.set('noteMode', noteMode); const l = LEC[(location.hash||'').slice(1)]; if (l) renderNotes(l, $('#pane')); return; }
  const qc = e.target.closest('[data-qsubj]');
  if (qc){ quickSubj = qc.dataset.qsubj; document.querySelectorAll('.qchip').forEach(c=>c.classList.toggle('on', c===qc)); renderQuick(); return; }
  const t = e.target.closest('[data-go],[data-tab],[data-act],[data-sec-jump]');
  if (!t) return;
  if (t.dataset.secJump!=null){
    e.preventDefault(); const el = $('#sec-'+t.dataset.secJump); if (el) el.scrollIntoView({behavior:'smooth',block:'start'}); return;
  }
  if (t.dataset.go!=null){
    const sec = t.dataset.sec;
    if (sec!=null){ const n=+sec; lecTab = n===-2 ? 'cards' : 'notes'; pendingSec = n>=0?n:null; }
    else if (LEC[t.dataset.go]) lecTab = 'notes';
    go(t.dataset.go); return;
  }
  if (t.dataset.tab){
    const l = LEC[(location.hash||'').slice(1)]; if (!l) return;
    lecTab = t.dataset.tab; renderTab(l); window.scrollTo({top:0}); return;
  }
  const act = t.dataset.act, l = LEC[t.dataset.id] || LEC[(location.hash||'').slice(1)];
  if (act==='install') installSheet();
  else if (act==='close') closeSheet();
  else if (act==='download' && l) doDownload(l);
  else if (act==='copy' && l) doCopy(l);
  else if (act==='cards-unknown') $('#pane')._redraw('unknown');
  else if (act==='cards-all') $('#pane')._redraw();
  else if (act==='cards-reset'){ const a=store.get('known',{}); delete a[l.id]; store.set('known',a); $('#pane')._redraw(); toast('Прогресс сброшен'); }
  else if (act==='quiz-again') renderQuiz(l, $('#pane'));
  else if (act==='dl-full' && l) openFile(FULL[l.id].pdf, `${l.subject.short} — ${l.num}. ${l.title} (полная версия).pdf`);
  else if (act==='dl-extra' && l) openFile(FULL[l.id].extra.pdf, FULL[l.id].extra.title + '.pdf');
});

window.__printable = id => printableHTML(LEC[id]);
window.__ask = (q,s) => answerSearch(q,s||'').map(r=>[r.sc.toFixed(2), r.it.l.id, r.it.kind, r.it.q]);
if (!window.claude && 'serviceWorker' in navigator && location.protocol==='https:'){
  // новая версия сайта: как только свежий service worker взял управление — один раз перезагружаемся
  const hadSW = !!navigator.serviceWorker.controller; let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadSW && !reloaded){ reloaded = true; location.reload(); } });
  navigator.serviceWorker.register('sw.js', {updateViaCache:'none'}).then(r => {
    document.addEventListener('visibilitychange', () => { if (document.visibilityState==='visible') r.update().catch(()=>{}); });
  }).catch(()=>{});
}
route();
})();

</script>
</body>
</html>
