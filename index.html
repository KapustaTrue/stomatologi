<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f4fa">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Зубрёжка · С-201</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Зубрёжка">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Конспекты, карточки и тесты группы С-201">
<script>
(function(){try{var t=JSON.parse(localStorage.getItem('s201:theme')||'null');}catch(e){t=null}
if(t!=='dark'&&t!=='light')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
document.documentElement.dataset.theme=t;})();
</script>
<link rel="preload" href="fonts/golos-text-cyrillic-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/unbounded-cyrillic-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
:root{
  --bg:#f5f4fa; --card:#fff; --ink:#1d2030; --muted:#6a6f82; --line:#e6e4ef;
  --acc:#7b61d6; --acc-soft:#f0ecff; --acc-ink:#46309a;
  --sut:#fdecef; --sut-b:#e0527a; --simple:#e7f6ea; --simple-b:#3f9e5c; --imp:#fff4d9; --imp-b:#e0a000; --fact:#eef3ff; --fact-b:#5b7fd6;
  --r:18px; --shadow:0 1px 2px rgba(20,20,50,.05),0 6px 20px rgba(20,20,50,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.55}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:var(--acc-ink)}
.wrap{max-width:760px;margin:0 auto;padding:0 16px calc(84px + env(safe-area-inset-bottom))}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:rgba(245,244,250,.88);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);padding-top:env(safe-area-inset-top);border-bottom:1px solid transparent}
.top.scrolled{border-bottom-color:var(--line)}
.top-in{max-width:760px;margin:0 auto;padding:10px 12px;display:flex;align-items:center;gap:8px;min-height:56px}
.back{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow);flex:none}
.back svg{width:20px;height:20px}
.top-title{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.icon-btn{height:40px;padding:0 12px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;flex:none}
.icon-btn svg{width:18px;height:18px}
/* home */
.hero{padding:18px 4px 6px}
.hero small{color:var(--muted);font-weight:600;letter-spacing:.02em}
.hero h1{font-size:30px;line-height:1.15;margin:4px 0 6px;font-weight:800;letter-spacing:-.02em}
.hero p{margin:0;color:var(--muted)}
.search{margin:16px 0 8px;position:relative}
.search input{width:100%;height:50px;border-radius:16px;border:1px solid var(--line);background:var(--card);padding:0 16px 0 46px;font:inherit;font-size:16px;color:var(--ink);box-shadow:var(--shadow);outline:none}
.search input:focus{border-color:var(--acc)}
.search svg{position:absolute;left:15px;top:15px;width:20px;height:20px;color:var(--muted)}
.section-label{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:22px 4px 10px}
.continue{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);width:100%;text-align:left}
.continue .em{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;flex:none}
.continue b{display:block;font-size:15px;line-height:1.3}
.continue span{font-size:13px;color:var(--muted)}
.subjects{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.subjects{grid-template-columns:1fr}}
.subj{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);text-align:left;display:flex;flex-direction:column;gap:10px;min-height:150px;position:relative;overflow:hidden;transition:transform .15s}
.subj:active{transform:scale(.98)}
.subj .em{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px}
.subj h3{margin:0;font-size:17px;line-height:1.25;font-weight:700}
.subj .teacher{font-size:13px;color:var(--muted);line-height:1.3;margin-top:-4px}
.subj-head p.t{margin:0 0 4px;opacity:1}
.lec-head p.lt{margin-top:6px;font-size:13px}
.subj .meta{margin-top:auto;font-size:13px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.subj .bar{position:absolute;left:0;right:0;bottom:0;height:4px}
.install{margin-top:22px;width:100%;display:flex;gap:12px;align-items:center;padding:14px;border-radius:var(--r);background:linear-gradient(135deg,#ece8ff,#e3efff);text-align:left}
.install .em{font-size:24px}
.install b{display:block;font-size:15px}
.install span{font-size:13px;color:var(--muted)}
/* subject page */
.subj-head{border-radius:24px;padding:20px;margin:6px 0 16px;color:#fff;position:relative;overflow:hidden}
.subj-head .em{font-size:38px;line-height:1}
.subj-head h1{margin:10px 0 4px;font-size:24px;line-height:1.2;font-weight:800}
.subj-head p{margin:0;opacity:.9;font-size:14px}
.lec{display:flex;gap:14px;align-items:center;background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);width:100%;text-align:left;margin-bottom:10px}
.lec .n{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-weight:800;font-size:17px;flex:none}
.lec b{display:block;font-size:16px;line-height:1.3}
.lec span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.lec .prog{font-size:12px;font-weight:600;margin-top:6px;display:flex;gap:10px}
.lec.soon{opacity:.55;box-shadow:none;border:1px dashed var(--line);background:transparent;cursor:default}
.chev{margin-left:auto;color:#b6b9c8;flex:none}
/* lecture */
.lec-head{padding:6px 4px 4px}
.lec-head .kicker{font-size:13px;font-weight:700;color:var(--acc)}
.lec-head h1{margin:4px 0 6px;font-size:26px;line-height:1.2;font-weight:800;letter-spacing:-.01em}
.lec-head p{margin:0;color:var(--muted);font-size:14px}
.tabs{position:sticky;top:calc(56px + env(safe-area-inset-top));z-index:15;display:flex;gap:6px;padding:10px 0;background:var(--bg)}
.tab{flex:1;height:42px;border-radius:13px;font-weight:600;font-size:14px;background:var(--card);box-shadow:var(--shadow);color:var(--muted)}
.tab.on{background:var(--acc);color:#fff}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 6px}
.chip{height:38px;padding:0 14px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:7px}
.chip svg{width:17px;height:17px}
.toc{background:var(--card);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow);margin:12px 0}
.toc summary{font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
.toc summary::-webkit-details-marker{display:none}
.toc ol{margin:10px 0 2px;padding-left:22px}
.toc li{margin:4px 0}
.toc a{color:var(--ink);text-decoration:none}
.sec{background:var(--card);border-radius:var(--r);padding:18px 16px;box-shadow:var(--shadow);margin:12px 0;scroll-margin-top:130px}
.sec h2{margin:0 0 12px;font-size:20px;line-height:1.25;display:flex;gap:10px;align-items:baseline}
.sec h2 .num{color:var(--acc);font-weight:800}
.sec p{margin:10px 0}
.sec ul,.sec ol{padding-left:22px;margin:10px 0}
.sec li{margin:6px 0}
.box{border-radius:14px;padding:12px 14px;margin:12px 0;border-left:4px solid}
.box .tag{display:block;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.box.sut{background:var(--sut);border-color:var(--sut-b)} .box.sut .tag{color:#b2244f}
.box.simple{background:var(--simple);border-color:var(--simple-b)} .box.simple .tag{color:#22663a}
.box.imp{background:var(--imp);border-color:var(--imp-b)} .box.imp .tag{color:#8a6200}
.box.fact{background:var(--fact);border-color:var(--fact-b)} .box.fact .tag{color:#2c4fa3}
.note{font-size:13px;color:var(--muted);background:#f6f6f9;border-radius:10px;padding:8px 12px;margin:10px 0}
.tbl{overflow-x:auto;margin:12px -4px;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:14.5px;line-height:1.4}
th{background:var(--acc-soft);color:var(--acc-ink);text-align:left;font-weight:700;padding:9px 10px}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere;hyphens:auto}
th:first-child{border-radius:10px 0 0 0} th:last-child{border-radius:0 10px 0 0}
figure{margin:14px 0;text-align:center}
figure svg{max-width:100%;height:auto}
figure.pic img{max-width:100%;height:auto;border-radius:14px;box-shadow:var(--shadow);background:#fff}
figcaption{font-size:13px;color:var(--muted);margin-top:6px}
.remember{background:linear-gradient(160deg,#fff7d6,#fff1c2);border-radius:var(--r);padding:18px 16px;margin:16px 0}
.remember h2{margin:0 0 8px;font-size:20px}
.remember li{margin:8px 0}
.facts .box{margin:10px 0}
.outlink{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);margin:12px 0;text-decoration:none;color:var(--ink)}
.outlink b{display:block}
.outlink span{font-size:13px;color:var(--muted)}
/* flashcards */
.fc-wrap{margin:10px 0}
.fc{position:relative;height:280px;cursor:pointer;user-select:none;-webkit-user-select:none}
.face{position:absolute;inset:0;border-radius:22px;padding:24px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;box-shadow:var(--shadow);transition:opacity .25s,transform .25s}
.face.ffront{background:var(--card)}
.face.fback{background:var(--acc);color:#fff;opacity:0;transform:scale(.96);pointer-events:none}
.fc.flip .face.ffront{opacity:0;transform:scale(.96)}
.fc.flip .face.fback{opacity:1;transform:none}
.face .lbl{position:absolute;top:16px;left:18px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;opacity:.6}
.face .txt{font-size:21px;font-weight:700;line-height:1.35}
.face.fback .txt{font-size:19px;font-weight:600}
.face .hint{position:absolute;bottom:14px;font-size:12px;opacity:.55}
.fc-ctrl{display:flex;gap:10px;margin-top:12px}
.fc-ctrl button{flex:1;height:52px;border-radius:15px;font-weight:700;font-size:15px}
.btn-no{background:#ffe6e6;color:#a82424}
.btn-yes{background:#dff4e4;color:#1f6a37}
.fc-top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted);font-weight:600;margin-top:8px}
.pbar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0}
.pbar i{display:block;height:100%;background:var(--acc);border-radius:6px;transition:width .3s}
.link-btn{color:var(--acc-ink);font-weight:600;font-size:14px;padding:6px 0}
.done{text-align:center;background:var(--card);border-radius:22px;padding:28px 20px;box-shadow:var(--shadow);margin:12px 0}
.done .big{font-size:44px}
.done h3{margin:8px 0 4px;font-size:21px}
.done p{color:var(--muted);margin:0 0 16px}
.primary{height:50px;padding:0 22px;border-radius:15px;background:var(--acc);color:#fff;font-weight:700;font-size:15px}
.secondary{height:50px;padding:0 22px;border-radius:15px;background:var(--acc-soft);color:var(--acc-ink);font-weight:700;font-size:15px}
/* quiz */
.q-card{background:var(--card);border-radius:22px;padding:20px 16px;box-shadow:var(--shadow);margin:10px 0}
.q-card h3{margin:4px 0 14px;font-size:19px;line-height:1.35}
.opt{display:block;width:100%;text-align:left;padding:14px 16px;border-radius:14px;border:2px solid var(--line);margin:8px 0;font-size:15.5px;font-weight:500;background:#fff;transition:background .15s,border-color .15s}
.opt.right{border-color:#3f9e5c;background:#e7f6ea}
.opt.wrong{border-color:#d64545;background:#fdeaea}
.opt:disabled{cursor:default}
.why{border-radius:14px;padding:12px 14px;margin-top:12px;font-size:15px}
.why.ok{background:#e7f6ea} .why.bad{background:#fdeaea}
/* search results */
.res{display:block;width:100%;text-align:left;background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);margin-bottom:8px}
.res small{font-size:12px;font-weight:700}
.res b{display:block;font-size:15px;margin:2px 0}
.res span{font-size:13.5px;color:var(--muted);display:block}
mark{background:#ffe58a;color:inherit;border-radius:3px;padding:0 1px}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
/* sheet / modal */
.scrim{position:fixed;inset:0;background:rgba(20,20,40,.35);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;animation:up .25s cubic-bezier(.3,.7,.3,1)}
@media(min-width:600px){.scrim{align-items:center}.sheet{border-radius:24px}}
.sheet h3{margin:0 0 6px;font-size:20px}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:-6px auto 14px}
.sheet .os{background:var(--bg);border-radius:16px;padding:14px;margin:12px 0}
.sheet .os b{display:block;margin-bottom:6px}
.sheet ol{margin:0;padding-left:20px}
.sheet li{margin:5px 0}
@keyframes fade{from{opacity:0}} @keyframes up{from{transform:translateY(30px);opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1d2030;color:#fff;padding:11px 18px;border-radius:14px;font-size:14px;font-weight:600;z-index:60;max-width:90vw;text-align:center;animation:up .2s}
.quick-btn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin-top:14px;padding:14px 16px;border-radius:var(--r);background:linear-gradient(135deg,#ffcf3f,#ff9d2e);color:#3a2300;box-shadow:0 6px 18px rgba(255,157,46,.35)}
.quick-btn .qi{font-size:28px;line-height:1}
.quick-btn b{display:block;font-size:17px}
.quick-btn span{font-size:13px;opacity:.85}
.quick-btn .chev{color:#7a4b00;margin-left:auto}
.quick-head{padding:8px 4px 0}
.quick-head h1{margin:4px 0 4px;font-size:26px;font-weight:800}
.quick-head p{margin:0;color:var(--muted);font-size:14px}
.quick-search input{height:56px;font-size:18px;border-width:2px}
.qchips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 6px;-webkit-overflow-scrolling:touch}
.qchip{flex:none;height:36px;padding:0 14px;border-radius:18px;background:var(--card);box-shadow:var(--shadow);font-size:14px;font-weight:600;color:var(--muted)}
.qchip.on{background:#1d2030;color:#fff}
.qbest{background:var(--card);border-radius:22px;padding:18px 16px;box-shadow:var(--shadow);border-top:5px solid var(--c);margin:10px 0}
.qsrc{font-size:12px;font-weight:700;color:var(--muted)}
.qq{font-size:15px;font-weight:700;color:var(--muted);margin:6px 0 8px}
.qbest .qa{font-size:19px;line-height:1.5;font-weight:500}
.qalt .qa{font-size:16px;line-height:1.5;margin:8px 0}
.qmore{margin-top:10px;font-size:14px;color:var(--muted)} .qmore summary{cursor:pointer;font-weight:600;color:var(--ink)}
.qopen{margin-top:12px;font-size:14px;font-weight:700;color:var(--acc-ink);padding:4px 0}
.qalt{background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);margin-bottom:8px}
.qalt summary{cursor:pointer;list-style:none} .qalt summary::-webkit-details-marker{display:none}
.qalt small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.qalt b{display:block;font-size:15px;margin-top:2px}
.qtips{background:var(--card);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow);margin-top:10px;font-size:15px}
.qtips ul{margin:8px 0 0;padding-left:20px} .qtips li{margin:5px 0}
.mode{display:flex;background:var(--card);border-radius:14px;padding:4px;box-shadow:var(--shadow);margin:6px 0 4px}
.mode button{flex:1;height:40px;border-radius:11px;font-weight:700;font-size:14px;color:var(--muted)}
.mode button.on{background:var(--acc-soft);color:var(--acc-ink)}
.pages{display:flex;flex-direction:column;gap:12px;margin:10px 0}
.pg{display:block;border-radius:12px;overflow:hidden;box-shadow:var(--shadow);background:#fff}
.pg img{display:block;width:100%;height:auto}
.pcount{font-size:13px;color:var(--muted);align-self:center}
.fullcard{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,var(--acc-soft),#fff);border-radius:var(--r);padding:18px 16px;box-shadow:var(--shadow);margin:12px 0;text-decoration:none;color:var(--ink)}
.fullcard .big{font-size:34px} .fullcard b{display:block;font-size:17px} .fullcard span{font-size:13px;color:var(--muted)}
/* навигация в полной версии */
.navrow{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.navrow button{height:46px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px}
.navrow svg{width:17px;height:17px}
@media (min-width:600px){.navrow{grid-template-columns:repeat(4,1fr)}}
.fab-top{position:fixed;right:max(16px, env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom));z-index:25;width:48px;height:48px;border-radius:16px;background:#1d2030;color:#fff;font-size:22px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.22);opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .2s,transform .2s}
.fab-top.show{opacity:1;transform:none;pointer-events:auto}
/* просмотр страницы */
html.vw-open,html.vw-open body{overflow:hidden}
html.vw-open .fab-top{display:none}
.viewer{position:fixed;inset:0;z-index:100;background:#14161f;display:flex;flex-direction:column;color:#fff}
.vw-top,.vw-bot{flex:none;display:flex;align-items:center;gap:8px;padding:10px 12px;background:#1d2030}
.vw-top{padding-top:calc(10px + env(safe-area-inset-top))}
.vw-bot{padding-bottom:calc(10px + env(safe-area-inset-bottom));justify-content:space-between}
.vw-title{flex:1;min-width:0;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.8}
.vw-btn{height:42px;min-width:42px;padding:0 12px;border-radius:12px;background:rgba(255,255,255,.12);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:4px;flex:none}
.vw-btn svg{width:19px;height:19px}
.vw-btn:disabled{opacity:.3;cursor:default}
.vw-count{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.vw-stage{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;display:flex;align-items:flex-start;justify-content:center;padding:10px}
.vw-stage img{display:block;width:100%;max-width:900px;height:auto;margin:auto;border-radius:6px;background:#fff}
.viewer.zoomed .vw-stage{display:block}
.viewer.zoomed .vw-stage img{width:200%;max-width:none}
a.qopen{display:inline-block;text-decoration:none}
a.res{text-decoration:none;color:inherit}
.foot{text-align:center;color:var(--muted);font-size:12.5px;margin-top:30px}

/* экзамен */
.sch-joke{background:linear-gradient(135deg,#e8fbe9,#fdf6d8);border:2px dashed #3fae57;border-radius:16px;padding:12px 14px;margin:0 0 12px;font-size:14.5px;line-height:1.45;color:#1f4d2a}
html[data-theme=dark] .sch-joke{background:#15281a;color:#c9f2d2;border-color:#3fae57}
.sch-chg{background:#fff1e6;border:2px solid #ff8a3d;border-radius:14px;padding:10px 14px;margin-bottom:12px;font-size:14px;color:#6b3410}
.sch-chg b{display:block;margin-bottom:4px}.sch-chg ul{margin:0;padding-left:18px}.sch-chg li{margin:2px 0}
.sch-chg-tag{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:999px;background:#ff8a3d;color:#fff;font-size:11px;font-weight:700;vertical-align:middle}
.sb-chg{display:inline-block!important;color:#fff!important;background:rgba(0,0,0,.22);border-radius:999px;padding:2px 9px;font-weight:700;font-size:12px!important;margin-top:5px}
html[data-theme=dark] .sch-chg{background:#2e1d10;color:#ffd2ad;border-color:#c8611c}
.exam-entry{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);margin:0 0 16px;border:2px solid var(--c)}
.exam-entry .ee-em{width:46px;height:46px;border-radius:14px;background:var(--cs);display:grid;place-items:center;font-size:24px;flex:none}
.exam-entry b{display:block;font-size:16px;line-height:1.3;color:var(--ci)}
.exam-entry span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.exam-entry small{display:block;font-size:12px;font-weight:700;color:var(--ci);margin-top:3px}
.exam-entry>div:nth-child(2){flex:1;min-width:0}
.ee-prog{height:6px;border-radius:4px;background:var(--cs);margin-top:8px;overflow:hidden}
.ee-prog i{display:block;height:100%;background:var(--c);border-radius:4px}
.ee-prog.light{background:rgba(255,255,255,.3)} .ee-prog.light i{background:#fff}
.ex-stat small{display:block;font-weight:700;margin-top:4px;font-size:13px}
.ex-tabs{margin:0 0 10px}
.ex-search{margin:0 0 8px}
.ex-tools .actions{margin:8px 0 12px}
.chip.on{background:var(--acc-soft);color:var(--acc-ink)}
.exq{background:var(--card);border-radius:16px;box-shadow:var(--shadow);margin-bottom:9px;overflow:hidden;border-left:4px solid transparent}
.exq.known{border-left-color:#3f9e5c}
.exq summary{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;cursor:pointer;list-style:none}
.exq summary::-webkit-details-marker{display:none}
.exq summary b{flex:1;font-size:15px;line-height:1.35;font-weight:650}
.ex-n{min-width:34px;height:30px;padding:0 6px;border-radius:10px;background:var(--acc-soft);color:var(--acc-ink);font-weight:800;font-size:14px;display:grid;place-items:center;flex:none}
.ex-ok{color:#3f9e5c;font-weight:800;font-size:17px;min-width:14px}
.exq[open] summary{border-bottom:1px solid var(--line, rgba(127,127,127,.15))}
.ex-a{padding:4px 14px 14px}
.ex-mode{margin:8px 0 10px;box-shadow:none;background:var(--bg)}
.ex-mode button{height:36px;font-size:13.5px}
.ex-short{margin:4px 0 6px;padding-left:20px;font-size:15.5px;line-height:1.5}
.ex-short li{margin:6px 0}
.ex-full{font-size:15px;line-height:1.55}
.ex-full p{margin:8px 0} .ex-full ul,.ex-full ol{padding-left:20px;margin:6px 0} .ex-full li{margin:4px 0}
.ex-pics{margin-top:8px}
.ex-full h3{font-size:15.5px;margin:14px 0 6px}
.ex-foot{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.ex-lec,.ex-know{height:36px;padding:0 12px;border-radius:11px;background:var(--bg);font-weight:650;font-size:13.5px}
.ex-know{margin-left:auto;background:var(--acc-soft);color:var(--acc-ink)}
.ex-know.on{background:#3f9e5c;color:#fff}
figure svg text{font-family:"Golos Text",Inter,sans-serif}

.hero h1{font-size:44px;font-weight:800;line-height:1.02;background:linear-gradient(100deg,var(--hl1),var(--hl2) 55%,var(--hl3));-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:4px}
.hero small{display:inline-block;background:var(--card-solid);border-radius:20px;padding:5px 12px;font-size:12px;color:var(--hl1);box-shadow:var(--shadow)}
.hero p{max-width:28ch}
.subjects{gap:14px}
.subj{background:linear-gradient(145deg,var(--c),var(--ci));color:#fff;border:0;min-height:170px;box-shadow:0 18px 30px -16px var(--c)}
.subj::before{content:"";position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.14)}
.subj::after{content:"";position:absolute;right:20px;bottom:-40px;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.1)}
.subj .em{background:rgba(255,255,255,.22)!important;width:54px;height:54px;font-size:28px;border-radius:18px}
.subj .teacher,.subj .meta{color:rgba(255,255,255,.88)} .subj .chev{color:#fff} .subj .bar{display:none}
.subj h3{font-size:16px;font-weight:700}
.quick-btn{background:linear-gradient(120deg,#ffd23f,#ff8a3d 60%,#ff4f9a);color:#2a1300;border-radius:24px;padding:18px;position:relative;overflow:hidden}
.quick-btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.45) 45%,transparent 60%);transform:translateX(-100%);animation:shine 3.5s infinite}
@keyframes shine{60%,100%{transform:translateX(100%)}}
@media (prefers-reduced-motion:reduce){.quick-btn::after{animation:none;display:none}}
.install{background:linear-gradient(135deg,#ece5ff,#ffe6f1)}
.section-label{font-size:12px;color:#7c6bd6}
/* предмет и лекция */
.subj-head{border-radius:28px;box-shadow:0 20px 34px -18px rgba(60,40,140,.6)}
.subj-head::after{content:"";position:absolute;right:-20px;bottom:-34px;width:300px;height:210px;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22300%22%20height%3D%22210%22%20viewBox%3D%220%200%20300%20210%22%20fill%3D%22none%22%20stroke%3D%22%23ffffff%22%20stroke-width%3D%221.4%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%20opacity%3D%221%22%3E%3Cg%20transform%3D%22translate%28150%206%29%20rotate%28-8%2055.199999999999996%2055.199999999999996%29%20scale%282.3%29%22%3E%3Cpath%20d%3D%22M15%207c-6%200-9%205-9%2011%200%207%204%2010%205%2018%201%205%202%209%205%209%204%200%203-9%206-12%201-1%203-1%204%200%203%203%202%2012%206%2012%203%200%204-4%205-9%201-8%205-11%205-18%200-6-3-11-9-11-4%200-6%202-9%202s-5-2-9-2z%22/%3E%3C/g%3E%3Cg%20transform%3D%22translate%2860%2020%29%20rotate%2814%2045.599999999999994%2045.599999999999994%29%20scale%281.9%29%22%3E%3Cpath%20d%3D%22M14%204c0%2010%2020%2012%2020%2022s-20%2012-20%2022M34%204c0%2010-20%2012-20%2022s20%2012%2020%2022%22/%3E%3Cpath%20d%3D%22M17%2011h14M15%2018h18M17%2033h14M15%2040h18%22%20opacity%3D%22.7%22/%3E%3C/g%3E%3Cg%20transform%3D%22translate%288%2096%29%20rotate%280%2028.799999999999997%2028.799999999999997%29%20scale%281.2%29%22%3E%3Ccircle%20cx%3D%2224%22%20cy%3D%2224%22%20r%3D%2210%22/%3E%3Cpath%20d%3D%22M24%206v6M24%2036v6M6%2024h6M36%2024h6M11%2011l4%204M33%2033l4%204M37%2011l-4%204M15%2033l-4%204%22/%3E%3Ccircle%20cx%3D%2221%22%20cy%3D%2222%22%20r%3D%222%22/%3E%3Ccircle%20cx%3D%2227%22%20cy%3D%2227%22%20r%3D%221.5%22/%3E%3C/g%3E%3Cg%20transform%3D%22translate%28238%20104%29%20rotate%2840%2026.400000000000002%2026.400000000000002%29%20scale%281.1%29%22%3E%3Cpath%20d%3D%22M13%209a5%205%200%200%200-4%209%205%205%200%200%200%207%205l9%209a5%205%200%200%200%205%207%205%205%200%200%200%209-4%205%205%200%200%200-5-7l-9-9a5%205%200%200%200-7-5%205%205%200%200%200-5-5z%22/%3E%3C/g%3E%3C/svg%3E") no-repeat;opacity:.45;pointer-events:none}
.lec .n{border-radius:16px;font-family:"Unbounded",sans-serif}
.tabs{background:transparent;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.tab{border-radius:16px;font-size:13px}
.tab.on,.primary,.face.fback,.fab-top{background:linear-gradient(135deg,var(--acc),#ff4f9a)}
.tab.on{box-shadow:0 10px 20px -10px var(--acc)}
.lec-head h1{font-size:25px;font-weight:700}
.sec h2{font-size:18px;font-weight:700}
.box{border-left:0;border-radius:18px}
.remember{background:linear-gradient(140deg,#fff3c4,#ffe0ef)}
.note{background:rgba(255,255,255,.6)}
.opt{background:var(--card-solid)}
.qchip.on{background:linear-gradient(135deg,#6b4cff,#ff4f9a);color:#fff;border-color:transparent}
.qbest{border-top-width:5px}
.pg{border-radius:16px}
.face{border-radius:26px}
/* шутки */
.joke{display:flex;align-items:center;gap:10px;width:100%;text-align:left;margin:12px 0 0;padding:11px 12px 11px 14px;border-radius:18px;background:var(--card);border:1px dashed #c9bdf5;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-size:14px;line-height:1.4;color:var(--ink)}
.joke .jk-ic{font-size:20px;flex:none}
.joke .jk-t{flex:1;font-style:italic}
.joke .jk-dice{flex:none;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--card-solid);box-shadow:var(--shadow);font-size:17px}
.joke.jk-roll .jk-dice{animation:dice .45s ease}
.joke.jk-roll .jk-t{animation:jkfade .32s ease}
@keyframes dice{50%{transform:rotate(200deg) scale(1.15)}100%{transform:rotate(360deg)}}
@keyframes jkfade{50%{opacity:0;transform:translateY(4px)}}
.done-joke{font-style:italic;color:var(--muted);font-size:14px;margin:-8px 0 16px!important}
.empty small{display:block;margin-top:6px;font-size:13px;opacity:.8}

/* расписание */
.sched-btn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin-top:12px;padding:15px 16px;border-radius:24px;color:#fff;background:linear-gradient(120deg,#13b5c9,#2f6fd6 55%,#6b4cff);box-shadow:0 16px 30px -16px rgba(47,111,214,.8);position:relative;overflow:hidden}
.sched-btn::before{content:"";position:absolute;right:-26px;top:-34px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.13)}
.sched-btn .sb-ic{width:46px;height:46px;border-radius:15px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:24px;flex:none}
.sched-btn .sb-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.sched-btn b{font-family:"Unbounded",sans-serif;font-size:16px;font-weight:700}
.sched-btn .sb-txt>span{font-size:13px;opacity:.92;line-height:1.35}
.sched-btn .live{font-family:inherit;font-size:13px;color:#b6ffcf;animation:blink 1.6s infinite}
.sched-btn svg{flex:none;opacity:.85}
@keyframes blink{50%{opacity:.45}}
.sch-head h1{font-size:28px;margin:10px 0 4px}.sch-head p{color:var(--muted);margin:0 0 14px}
.sch-warn{background:#fff3c4;border-radius:14px;padding:10px 14px;font-size:14px;margin-bottom:12px}
.sch-tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;position:sticky;top:calc(56px + env(safe-area-inset-top));z-index:5;padding:6px 0;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.sch-tab{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 0 6px;border-radius:16px;background:var(--card);border:1px solid var(--glass);box-shadow:var(--shadow)}
.sch-tab b{font-family:"Unbounded",sans-serif;font-size:12px}
.sch-tab span{font-size:18px;font-weight:700}
.sch-tab i{font-style:normal;font-size:10px;letter-spacing:1px;color:var(--muted);height:12px;line-height:12px}
.sch-tab.today{border:2px solid #2f6fd6}
.sch-tab.on{background:linear-gradient(135deg,#2f6fd6,#6b4cff);color:#fff;border-color:transparent}
.sch-tab.on i{color:rgba(255,255,255,.8)}
.sch-dayhead{display:flex;align-items:baseline;justify-content:space-between;margin:16px 2px 10px}
.sch-dayhead h2{font-size:20px;margin:0}.sch-dayhead span{color:var(--muted);font-size:14px}
.sch-pair{display:flex;gap:12px;width:100%;text-align:left;padding:14px;margin-bottom:10px;border-radius:20px;background:var(--card);border:1px solid var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--shadow);border-left:5px solid var(--c);color:var(--ink)}
.sch-pair.past{opacity:.5}
.sch-pair.live{box-shadow:0 0 0 2px var(--c),0 18px 30px -16px var(--c)}
.sch-time{flex:none;width:56px;display:flex;flex-direction:column;align-items:flex-start}
.sch-time b{font-family:"Unbounded",sans-serif;font-size:15px}
.sch-time span{color:var(--muted);font-size:13px}
.sch-time i{font-style:normal;font-size:11px;margin-top:6px;padding:2px 7px;border-radius:8px;background:var(--cs);color:var(--ci);font-weight:700}
.sch-body{flex:1;min-width:0}
.sch-name{font-weight:700;font-size:16px;display:flex;gap:7px;align-items:center;line-height:1.25}
.sch-em{font-size:18px}
.sch-meta{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:7px;font-size:13px;color:var(--muted)}
.sch-room{background:var(--cs);color:var(--ci);font-weight:700;padding:2px 9px;border-radius:9px}
.sch-live{margin-top:9px;font-size:12.5px;font-weight:700;color:var(--c)}
.sch-prog{height:6px;border-radius:4px;background:var(--cs);margin-top:5px;overflow:hidden}
.sch-prog i{display:block;height:100%;background:var(--c);border-radius:4px}
.sch-gap{text-align:center;color:var(--muted);font-size:13px;margin:-2px 0 10px;padding:6px;border:1px dashed var(--line);border-radius:14px}
.sch-free{text-align:center;padding:30px 16px;border-radius:22px;background:var(--card);border:1px solid var(--glass)}
.sched-btn .sb-hw{flex:none;background:#fff;color:#2f6fd6;font-weight:800;font-size:13px;padding:5px 9px;border-radius:12px;box-shadow:0 6px 14px -6px rgba(0,0,0,.35)}
.sch-tab{position:relative}
.sch-tab-hw{position:absolute;top:-6px;right:-3px;font-style:normal;font-size:13px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.2))}
.sch-hw{display:flex;gap:7px;margin-top:9px;padding:8px 10px;border-radius:12px;background:#fff6d6;color:#4a3800;font-size:13.5px;line-height:1.4}
.sch-hw small{color:#8a7430}
.sch-hw-ic{flex:none}
.sch-hwlist{margin-top:22px}
.sch-hwlist h3{font-size:17px;margin:0 2px 10px}
.sch-hwitem{display:flex;flex-direction:column;gap:3px;width:100%;text-align:left;padding:12px 14px;margin-bottom:8px;border-radius:16px;background:var(--card);border:1px solid var(--glass);border-left:4px solid var(--c);box-shadow:var(--shadow);color:var(--ink)}
.sch-hwitem .when{font-size:12px;font-weight:700;color:var(--ci)}
.sch-hwitem b{font-size:14.5px}
.sch-hwitem .txt{font-size:14px;color:var(--muted)}
.sch-hw-empty{color:var(--muted);margin:4px 2px 10px}
.sch-hw-how{font-size:13px;color:var(--muted);padding:12px 14px;border-radius:14px;border:1px dashed var(--line);margin-top:6px;line-height:1.45}
.sch-hw-how code{background:var(--card-solid);padding:1px 6px;border-radius:6px;font-size:12.5px;color:var(--ink)}
.sch-free .big{font-size:44px}.sch-free p{color:var(--muted);margin:6px 0 0}

/* ===== ночной режим ===== */

Object.assign(SVG_EXTRA, (() => {

  const im = (f, x, y, w, h) => `<image href="img/sd/${f}" x="${x}" y="${y}" width="${w}" height="${h}" preserveAspectRatio="xMidYMid meet"/>`;

'imm-1': [
  ['Что такое иммунопрофилактика?', 'Иммунопрофилактика — защита населения от инфекционных болезней путём создания или усиления искусственного иммунитета.', 'ип определение'],
  ['Виды иммунопрофилактики', 'Специфическая — активная (вакцины) и пассивная (сыворотки и иммуноглобулины); неспецифическая (здоровый образ жизни, витамины); стимулирующая (иммуномодуляторы); подавляющая (иммуносупрессоры).', 'классификация ип активная пассивная'],
  ['Что такое вакцины?', 'Вакцины — препараты для активной иммунопрофилактики и иммунотерапии. Они содержат антигены возбудителя, на которые организм вырабатывает антитела и клетки памяти.', 'определение вакцины прививка'],
  ['Моновакцины и поливакцины', 'Моновакцины содержат антигены одного вида возбудителя, поливакцины — антигены нескольких возбудителей сразу.', ''],
  ['Классификация (типы) вакцин', 'Корпускулярные (живые и убитые), молекулярные (анатоксины и субъединичные), ассоциированные, химические, генно-инженерные, живые с реконструированным геномом, антиидиотипические, ДНК-вакцины и рибосомальные.', 'виды типы девять классификация'],
  ['Что такое анатоксин?', 'Анатоксин — обезвреженный токсин: он теряет ядовитость, но сохраняет антигенность, поэтому организм вырабатывает антитоксины. Примеры — дифтерийный и столбнячный анатоксины.', 'токсин антитоксин'],
  ['Что такое АКДС?', 'АКДС — адсорбированная коклюшно-дифтерийно-столбнячная вакцина. Состоит из убитых коклюшных микробов, дифтерийного и столбнячного анатоксинов. Относится к ассоциированным вакцинам. «Адсорбированная» — антигены на гидроксиде алюминия.', 'акдс коклюш дифтерия столбняк ассоциированные'],
  ['Химические вакцины', 'Химические вакцины содержат очищенные антигены, химически извлечённые из микробов. Примеры: антигриппозная, антисальмонеллёзная, противобрюшнотифозная.', 'синтетические'],
  ['Генно-инженерные вакцины', 'Содержат антигены, полученные методами генной инженерии, — только высокоиммуногенные компоненты. Пример — вакцина против гепатита B; также против сифилиса, холеры, бешенства.', 'гепатит b'],
  ['Антиидиотипические вакцины', 'Это вакцины без антигена: вместо него вводят антитела-«двойники», повторяющие форму антигена. Разрабатываются, например, против ВИЧ.', 'без антигена вич'],
  ['ДНК-вакцины и рибосомальные вакцины', 'ДНК-вакцины содержат фрагменты ДНК и плазмиды — клетки сами синтезируют антиген. Рибосомальные содержат рибосомы возбудителя, например бронхиальная и дизентерийная вакцины.', 'плазмиды рибосомы'],
  ['Поствакцинальные реакции и осложнения', 'Реакции — ожидаемый ответ: покраснение, уплотнение, небольшая температура, проходят за 1–3 дня. Осложнения — тяжёлые и редкие: анафилактический шок, судороги, требуют лечения и регистрации.', 'побочные реакции осложнения'],
  ['Противопоказания к вакцинации', 'Острое заболевание (прививку откладывают), тяжёлая реакция на предыдущую дозу; живые вакцины — при тяжёлом иммунодефиците и беременности. После прививки наблюдают не менее 30 минут.', 'противопоказания нельзя'],
  ['Что такое ревакцинация?', 'Ревакцинация — повторное введение вакцины для поддержания иммунитета, созданного предыдущими прививками. Со временем антител становится меньше, ревакцинация поднимает их снова — быстрее и выше за счёт клеток памяти. Например, от дифтерии и столбняка взрослым — раз в 10 лет.', 'повторная'],
  ['Что такое холодовая цепь?', 'Холодовая цепь — система хранения и транспортировки вакцин при температуре +2…+8 °C на всех этапах: завод, склад, транспорт, поликлиника, пациент. Цепь не должна прерываться: перегретая или замороженная вакцина теряет свои свойства.', 'хранение транспортировка температура холодильник +2 +8'],
  ['Требования к вакцинам', 'Безопасность — не вызывать болезнь и тяжёлые осложнения; высокая иммуногенность — создавать надёжный иммунитет; низкая реактогенность — минимум побочных реакций; стабильность — сохранять свойства при правильном хранении.', 'иммуногенность реактогенность безопасность стабильность'],
  ['Что такое адъюванты?', 'Адъюванты — вещества, которые усиливают иммунный ответ на вакцину. Пример — гидроксид алюминия в адсорбированных вакцинах, например в АКДС.', 'гидроксид алюминия усилитель'],
  ['Живые и убитые вакцины: отличия и примеры', 'Живые (аттенуированные) — ослабленный штамм, размножается, но болезнь не вызывает; иммунитет сильный и долгий, часто одна доза; нельзя при тяжёлом иммунодефиците и беременности. Примеры: корь, краснуха, паротит, полиомиелит, бруцеллёз, туляремия, БЦЖ. Убитые (инактивированные) — микроб убит нагревом или формалином; безопаснее, но иммунитет слабее, нужен курс и ревакцинации. Примеры: лептоспироз, дизентерия, холера, грипп.', 'корпускулярные аттенуированные инактивированные'],
  ['Как получают анатоксин?', 'Экзотоксин обрабатывают формалином 0,3–0,4 % при 37–40 °C в течение 3–4 недель (метод Рамона). Токсин теряет ядовитость, но сохраняет антигенность. Примеры анатоксинов: столбнячный, дифтерийный, ботулинический, стафилококковый.', 'рамон формалин'],
  ['Что такое сыворотки? Их виды', 'Сыворотки — средства пассивной иммунопрофилактики с готовыми антителами: защищают сразу, но несколько недель. По действию: антитоксические (противостолбнячная, противодифтерийная, противоботулиническая) и антимикробные/противовирусные (иммуноглобулин против бешенства, клещевого энцефалита, гепатита B). По происхождению: гетерологичные — от животных (лошадиная) и гомологичные — от человека.', 'иммуноглобулины пассивная гетерологичные гомологичные'],
  ['Метод Безредки', 'Дробное введение гетерологичной (лошадиной) сыворотки: сначала 0,1 мл сыворотки, разведённой 1:100, внутрикожно — проба, ждут 20 минут; затем 0,1 мл неразведённой подкожно, ждут 30–60 минут; затем остальная доза внутримышечно и наблюдение не менее 30 минут. Рядом должна быть противошоковая аптечка.', 'безредка дробное введение лошадиная сыворотка'],
  ['Что такое сывороточная болезнь?', 'Сывороточная болезнь — реакция на чужой белок гетерологичной сыворотки. Развивается через 7–14 дней: лихорадка, сыпь, боли в суставах, увеличение лимфоузлов.', 'осложнение сыворотки'],

'anat-2': [

  ['Что такое периодонт и пародонт?', 'Периодонт — связки между цементом корня и костью лунки, удерживают зуб и смягчают удары. Пародонт — поддерживающий комплекс: десна, периодонт, цемент и альвеолярная кость.', 'связки зуба'],
  ['Анатомическая и клиническая коронка', 'Анатомическая коронка — вся часть зуба, покрытая эмалью. Клиническая — часть, видимая над десной; с возрастом она увеличивается, потому что десна опускается.', ''],
  ['Виды зубов и их функции', 'Резцы (4 на челюсти) — откусывают; клыки (2) — разрывают и дробят; премоляры (4) — дробят и растирают; моляры (6) — перемалывают пищу.', 'резцы клыки премоляры моляры'],
  ['Сколько корней у зубов?', 'Резцы, клыки и премоляры — по одному корню (у первого верхнего премоляра часто 2). Нижние моляры — 2 корня, верхние моляры — 3 корня.', 'корни'],
  ['Зубная формула', 'Формула показывает число зубов на половине челюсти: резцы, клыки, премоляры, моляры. Молочные: 2·1·0·2 = 20 зубов. Постоянные: 2·1·2·3 = 32 зуба. У молочных нет премоляров.', 'формула молочные постоянные'],
  ['Сроки прорезывания зубов', 'Молочные — примерно с 6–8 месяцев. Постоянные: первые моляры и центральные резцы — в 6–8 лет, боковые резцы — 7–9, премоляры и клыки — 9–12, вторые моляры — 11–13, зубы мудрости — 17–25 лет.', 'прорезывание смена зубов'],

  ['Чем опасен хронический очаг инфекции в зубе?', 'Бактерии разносятся с кровью: возможны осложнения на сердце (клапаны, миокард), почки и суставы (артриты), особенно у детей. Очаг нужно санировать.', 'очаг инфекции мертвый зуб осложнения'],
  ['Виды прикуса', 'Правильный — верхние резцы немного перекрывают нижние. Дистальный — нижняя челюсть маленькая или сдвинута назад. Мезиальный — нижняя челюсть выступает вперёд.', 'прикус'],
  ['Травмы зубов', 'Ушиб (всё цело, заживает 2–3 недели), вывих: неполный (зуб в лунке), вколоченный (вбит в кость), полный (вышел из лунки); переломы коронки и корня. Лечение — вернуть зуб и зафиксировать шиной; при повреждении сосудов и нерва — депульпация и штифт.', 'вывих перелом ушиб зуба'],

'anat-1': [

  ['Классификация костей', 'Трубчатые (плечевая, бедренная), губчатые (позвонки, кости запястья), плоские (лопатка, кости свода черепа), смешанные и воздухоносные (верхняя челюсть).', 'виды костей'],
  ['Виды соединений костей', 'Непрерывные: синдесмозы (соединительной тканью), синхондрозы (хрящом), синостозы (костной тканью). Прерывные — суставы: суставные поверхности с хрящом, капсула, полость с синовиальной жидкостью.', 'сустав синдесмоз синхондроз синостоз'],

  ['Виды переломов', 'Открытые и закрытые, полные и неполные, со смещением и без; по линии излома — поперечные, косые, винтообразные, оскольчатые, вколоченные, компрессионные.', 'классификация переломов'],

    short: ['Текущая — не реже 2 раз в день моюще-дезинфицирующим средством: поверхности, мебель, оборудование, подоконники, двери, пол; затем бактерицидная лампа.', 'Генеральная — по графику (асептические — 1 раз в неделю, остальные — 1 раз в месяц), отдельным маркированным инвентарём и спецодеждой.', 'Порядок генуборки: подготовка → дезраствор сверху вниз (потолок, стены, оборудование, пол) → экспозиция → смывание → УФ-облучение и проветривание → обработка инвентаря → запись в журнал.', 'Контролирует старшая медсестра.'],

  { n: 29, q: 'Физический метод дезинфекции. Кварцевание, виды ламп, правила эксплуатации, журналы учёта', lec: ['sd-4', 'sd-7'],

  { n: 33, q: 'Влияние на организм медицинского персонала неблагоприятных химических и физических факторов', lec: ['sd-5'],
    short: ['Химические: дезсредства (раздражение кожи, глаз, дыхательных путей, аллергия, астма), лекарства — антибиотики, цитостатики (аллергия, токсичность), латекс, ртуть.', 'Физические: ионизирующее излучение (лучевая болезнь, онкология), УФ (ожоги глаз и кожи), электроток, шум, вибрация, высокие температуры.', 'Физические нагрузки: подъём пациентов, длительное стояние — болезни позвоночника, варикоз.', 'Профилактика: СИЗ, вентиляция, вытяжные шкафы, экранирование, дозиметрия, медосмотры, правильная биомеханика.'],

      ['h', 'Физические факторы'],

  practice: [
  { n: 1, q: 'Продемонстрируйте гигиеническую обработку рук с помощью кожного антисептика', lec: ['sd-8'],
    short: ['Снять кольца и часы, ногти короткие; руки сухие и без видимой грязи.', 'Нанести 3 мл антисептика (или по инструкции) на сухие ладони.', 'Втирать по 6 движениям (EN-1500), каждое 5 раз: ладонь о ладонь; правая ладонь по тылу левой и наоборот; ладони с переплетёнными пальцами; тыл согнутых пальцев о ладонь; круговое растирание больших пальцев; круговые движения кончиками пальцев по ладони.', 'Втирать до полного высыхания (не менее 30 сек), не вытирать.'],
    full: [['ol', ['Снять кольца, браслеты, часы; ногти коротко острижены, без лака.', 'Если руки видимо загрязнены — сначала вымыть с мылом и высушить.', 'Нанести на сухие руки 3 мл (или количество по инструкции) кожного антисептика.', 'Ладонь к ладони — растирающие движения.', 'Правая ладонь на тыльной стороне левой кисти и наоборот.', 'Ладонь к ладони, пальцы переплетены.', 'Тыльной стороной согнутых пальцев по ладони другой руки (пальцы в «замке»).', 'Круговое растирание большого пальца левой руки в сжатой ладони правой и наоборот.', 'Кончиками сжатых пальцев правой руки круговые движения по ладони левой и наоборот.', 'Каждое движение повторить не менее 5 раз; втирать до полного высыхания (не менее 30 сек), руки не вытирать.']], ['note', 'Гигиеническую обработку проводят перед контактом с пациентом, перед надеванием и после снятия перчаток, после контакта с биожидкостями, кожей пациента и предметами рядом с ним.']] },
  { n: 2, q: 'Приготовление и использование дезинфицирующих растворов', lec: ['sd-4', 'sd-5'],
    short: ['Выбрать средство по инструкции (цель, режим), рассчитать: средство = объём × % / 100, вода = объём − средство.', 'Надеть СИЗ (халат, перчатки, маска/респиратор, очки), работать в вентилируемом помещении.', 'В ёмкость налить воду, добавить средство, перемешать, закрыть крышкой.', 'Маркировка: название, концентрация, назначение, дата и время, подпись; использовать в пределах срока годности, соблюдать экспозицию.'],
    full: [['ol', ['Изучить инструкцию: выбрать режим (бактерии, вирусы, туберкулёз), концентрацию, экспозицию, срок годности раствора.', 'Рассчитать: <b>средство (мл) = объём (мл) × концентрация (%) / 100</b>; вода = объём − средство. Пример: 1% на 5 л — 50 мл средства + 4 950 мл воды.', 'Надеть СИЗ: халат, шапочку, резиновые перчатки, маску/респиратор, очки, фартук.', 'В эмалированную/пластиковую ёмкость налить воду, отмерить мерной ёмкостью средство (или таблетки), добавить, перемешать.', 'Закрыть крышкой, промаркировать: название, концентрация, назначение, дата и время приготовления, срок годности, подпись.', '<b>Использование</b>: изделия погружать полностью, в разобранном виде, каналы заполнять; поверхности протирать или орошать; выдерживать экспозицию; после — промыть водой.', 'Снять СИЗ, вымыть руки, нанести крем.']], ['table', ['Концентрация', 'На 1 л', 'На 5 л', 'На 10 л'], [['0,1%', '1 мл', '5 мл', '10 мл'], ['0,5%', '5 мл', '25 мл', '50 мл'], ['1%', '10 мл', '50 мл', '100 мл'], ['2%', '20 мл', '100 мл', '200 мл'], ['3%', '30 мл', '150 мл', '300 мл'], ['5%', '50 мл', '250 мл', '500 мл']]]] },

  { n: 5, q: 'Приготовить дезинфицирующий раствор для текущей уборки процедурного кабинета', lec: ['sd-4', 'sd-7'],

    full: [['ol', ['Выбрать зарегистрированное моюще-дезинфицирующее средство; для процедурного кабинета — режим, эффективный против бактерий и вирусов (гепатиты, ВИЧ).', 'Определить концентрацию и экспозицию по инструкции для обработки поверхностей.', 'Рассчитать объём: средство = объём × % / 100. Пример: 0,5% раствор, 5 л → 25 мл средства + 4 975 мл воды.', 'Надеть СИЗ, в промаркированную ёмкость «Для текущей уборки процедурного кабинета» налить воду, добавить средство, перемешать.', 'Закрыть крышкой, подписать: название, концентрация, дата и время, подпись.', 'Провести уборку: мебель, кушетка, оборудование, подоконники, двери, затем пол; ветошь и инвентарь — с маркировкой процедурного; после — включить облучатель, инвентарь обеззаразить.']]] },
  { n: 6, q: 'Приготовить раствор для дезинфекции одноразовых шприцев', lec: ['sd-4'],
    short: ['Использованные шприцы — отходы класса Б, обеззараживаются по режиму на вирусные гепатиты и ВИЧ.', 'Рассчитать раствор по инструкции, налить в ёмкость-контейнер с крышкой и перфорированным вкладышем, промаркировать.', 'Иглы отсечь иглосъёмником в непрокалываемый контейнер; шприц заполнить раствором (каналы) и погрузить полностью.', 'Выдержать экспозицию, слить раствор, шприцы — в жёлтый пакет (класс Б), на 3/4, маркировка.'],
    full: [['ol', ['Выбрать средство и режим, эффективный против вирусов парентеральных гепатитов и ВИЧ (по инструкции).', 'Рассчитать и приготовить раствор в СИЗ; налить в контейнер для дезинфекции с крышкой и перфорированным вкладышем.', 'Промаркировать: «Для дезинфекции шприцев», название средства, концентрация, дата, время, подпись.', 'После инъекции, не надевая колпачок, отсечь иглу иглосъёмником (иглоотсекателем) в непрокалываемый контейнер.', 'Набрать раствор в шприц, чтобы заполнить его полость, и погрузить шприц в раствор полностью (поршень можно вынуть).', 'Выдержать экспозицию по инструкции, вынуть вкладыш, дать стечь раствору.', 'Шприцы поместить в одноразовый пакет <b>жёлтого цвета</b> (класс Б), заполнить на 3/4, завязать, промаркировать.']], ['note', 'Если в МО есть аппаратное обеззараживание отходов, шприцы собирают сразу в жёлтую упаковку без химической дезинфекции — по схеме обращения с отходами.']] },
  { n: 7, q: 'Провести осмотр пациента на педикулёз и осуществить обработку волосистой части головы', lec: ['sd-2'],
    short: ['Надеть доп. халат, косынку, маску, перчатки; осмотреть голову при хорошем освещении (лупа, гребень): височные и затылочные области — вши и гниды.', 'Обработка: пациент на кушетке с клеёнкой, плечи — пелерина; нанести педикулицид по инструкции, накрыть косынкой, выдержать время.', 'Промыть шампунем, ополоснуть тёплым 6% уксусом, вычесать частым гребнем по прядям, повторно осмотреть.', 'Одежду — в мешок и в дезкамеру; отметка в истории болезни, журнал ф. 060/у, экстренное извещение ф. 058/у; повторный осмотр через 7 дней.'],
    full: [
      ['p', '<b>Противопедикулёзная укладка</b>: мешок для вещей, клеёнка, косынки/пелерина, педикулицид, частый гребень, ножницы, лупа, 6% уксус, шампунь, ватно-марлевые тампоны, перчатки, дополнительный халат, фартук, маска, спирт 70%.'],
      ['h', 'Осмотр'],
      ['ol', ['Объяснить пациенту процедуру, получить согласие.', 'Надеть дополнительный халат, косынку, маску, перчатки.', 'Усадить пациента под хорошим освещением; разделяя волосы на пряди гребнем, осмотреть с лупой височную и затылочную области, затем всю голову, брови, ресницы.', 'Признаки: живые вши, гниды (приклеены к волосу у корня), расчёсы, корки, зуд.']],
      ['h', 'Обработка волосистой части головы'],
      ['ol', ['Пациента усадить на кушетку, покрытую клеёнкой; плечи накрыть пелериной.', 'Нанести педикулицид на волосы по инструкции (смочить волосы у корней и по длине), накрыть косынкой/полиэтиленовой шапочкой, выдержать время экспозиции.', 'Промыть волосы тёплой водой с шампунем.', 'Ополоснуть тёплым 6% раствором уксусной кислоты — для отслоения гнид.', 'Вычесать волосы частым гребнем по прядям над клеёнкой или белой бумагой.', 'Повторно осмотреть; при обнаружении гнид — удалить механически.', 'Бумагу/клеёнку с вычесанным — в мешок и сжечь или обеззаразить; гребень — в дезраствор; одежду пациента и персонала — в мешок и в дезкамеру.', 'Помещение и инвентарь обработать инсектицидом/дезсредством; снять СИЗ, вымыть руки.']],
      ['h', 'Документация'],
      ['ul', ['отметка на лицевой стороне истории болезни («Р» — педикулёз);', 'регистрация в журнале учёта инфекционных заболеваний (ф. 060/у);', 'экстренное извещение (ф. 058/у) в ЦГиЭ по месту жительства;', 'повторный осмотр через 7 дней; в отделении все пациенты осматриваются каждые 7 дней.']],
      ['note', 'Педикулициды противопоказаны беременным, кормящим, детям до 5 лет, при заболеваниях кожи головы и аллергии (Приказ МЗ РФ № 342).'],
    ] },
  { n: 8, q: 'Провести генеральную уборку процедурного кабинета', lec: ['sd-7'],
    short: ['1 раз в неделю по графику; спецодежда и инвентарь с маркировкой «Для генуборки».', 'Освободить кабинет, отодвинуть мебель; дезраствором сверху вниз: потолок → стены, окна, двери → мебель, оборудование → пол.', 'Экспозиция по инструкции; сменить спецодежду; смыть раствор чистой водой.', 'Включить бактерицидный облучатель, проветрить; инвентарь обеззаразить; запись в журнал генуборок.'],
    full: [['p', 'Генеральная уборка процедурного кабинета (помещение с асептическим режимом, класс чистоты Б) — <b>1 раз в неделю</b> по графику.'], X.genclean] },
  { n: 9, q: 'Оформить медицинскую документацию при проведении генеральной уборки', lec: ['sd-7'],
    short: ['Журнал учёта проведения генеральных уборок: дата, помещение, дезсредство, концентрация, экспозиция, ФИО и подпись исполнителя и проверяющего.', 'Журнал регистрации и контроля работы бактерицидной установки: дата, время вкл./выкл., длительность, подпись.', 'График генеральных уборок (утверждает старшая медсестра).', 'При необходимости — отметка о взятии смывов (бакконтроль).'],

  { n: 10, q: 'Приготовить моющий раствор для ПСО ручным способом', lec: ['sd-6'],
    short: ['На 1 л: 5 г моющего средства («Лотос», «Астра», «Прогресс» и др.) + 170 мл 3% перекиси водорода + 825 мл воды.', 'Или готовый раствор средства для ПСО по инструкции.', 'Подогреть до 50 °C (раствор можно использовать повторно в течение суток, если не изменил цвет; подогревать до 6 раз).', 'Погрузить изделия на 15 мин, затем ершевание 30 сек, промывание, дистиллированная вода, сушка.'],
    full: [['ol', ['Надеть СИЗ (халат, перчатки, маску, очки).', 'Отмерить на 1 л раствора: <b>5 г</b> синтетического моющего средства («Лотос», «Астра», «Айна», «Прогресс», «Маричка»), <b>170 мл</b> 3% перекиси водорода, <b>825 мл</b> воды. (Если используется 33% перекись — 17 мл на 1 л, воды 978 мл.)', 'Смешать в ёмкости, промаркировать (название, дата, время, подпись).', 'Подогреть до <b>50 °C</b>; раствор используется в течение суток с момента приготовления, если не изменил цвет; подогревать можно до 6 раз.', 'Погрузить изделия в разобранном виде на 15 мин, каналы заполнить.']], X.pso] },
  { n: 11, q: 'Произвести контроль качества ПСО: азопирамовая проба', lec: ['sd-6'],
    short: ['Рабочий раствор: азопирам + 3% перекись водорода 1:1 (годен 1–2 ч); проверить на пятне крови.', 'Изделие комнатной температуры: 2–3 капли реактива или протереть тампоном, каналы — пипеткой.', 'Оценить в течение 1 мин: фиолетовое → розово-сиреневое — кровь (проба +); бурое — ржавчина; позже 1 мин не учитывают.', 'Положительная — вся партия на повторную ПСО; результат в журнал ф. 366/у; реактив смыть.'],
    full: [['ol', ['Взять для контроля 1% изделий каждого наименования (не менее 3 штук).', 'Приготовить рабочий раствор: смешать равные объёмы исходного раствора азопирама и 3% перекиси водорода (использовать в течение 1–2 ч).', 'Проверить реактив на пятне крови — в течение 1 мин должно появиться фиолетовое окрашивание.', 'Изделие должно быть комнатной температуры (на горячем проба недостоверна).', 'Нанести 2–3 капли реактива на изделие или протереть тампоном, смоченным реактивом; в каналы ввести реактив пипеткой/шприцем и вылить на белую салфетку.', 'Оценить результат в течение 1 минуты: фиолетовое окрашивание, переходящее в розово-сиреневое, — остатки крови; бурое — ржавчина; фиолетовое — хлорсодержащие окислители. Окрашивание позже 1 мин не учитывают.', 'Смыть реактив водой; изделия, участвовавшие в пробе, повторно проходят ПСО.', 'При положительной пробе вся партия повторно обрабатывается, начиная с промывания проточной водой.', 'Записать результат в журнал учёта качества ПСО (ф. 366/у).']]] },
  { n: 12, q: 'Продемонстрировать универсальную укладку бикса для стерилизации', lec: ['sd-6'],
    short: ['Проверить исправность бикса, открыть боковые отверстия; протереть дезраствором.', 'Выстелить дно и стенки простынёй (края наружу).', 'Разделить на секторы, в каждом — один вид материала (халаты, простыни, салфетки, шарики, полотенца) вертикально и рыхло; индикаторы — вверху, в центре и внизу (не менее 3, по одному в каждом секторе).', 'Закрыть краями простыни, закрыть крышку, бирка: отделение, содержимое, дата, подпись.'],
    full: [['p', '<b>Универсальная укладка</b> — в один бикс укладывают всё необходимое для одной операции или смены процедурного кабинета (халаты, простыни, салфетки, полотенца, шарики); бикс делят на секторы, в каждом — материал одного вида.'], ['ol', ['Проверить исправность бикса, обработать его изнутри и снаружи дезраствором, открыть боковые отверстия (сдвинуть поясок).', 'Обработать руки, надеть маску.', 'Выстелить бикс простынёй (пелёнкой) так, чтобы края свисали наружу.', 'Подготовить материал: простыни, халаты, полотенца скатать в рыхлые рулоны; салфетки по 10–20 штук, шарики — в марлевой салфетке.', 'Уложить материал по секторам <b>вертикально, рыхло</b> (между рулонами проходит ладонь), заполнив бикс не более чем на 2/3–3/4.', 'Положить индикаторы стерилизации: внизу, в центре, вверху (не менее трёх; при секторальной укладке — минимум по одному в каждый сектор).', 'Сверху положить халат, на него салфетки и полотенце — чтобы надеть халат, не открывая остальное.', 'Закрыть края простыни, закрыть крышку на замок, привязать бирку: отделение, вид материала, количество; после стерилизации — дата и подпись.', 'После стерилизации сразу закрыть боковые отверстия.']]] },
  { n: 13, q: 'Оформить журнал контроля качества стерилизации', lec: ['sd-6'],
    short: ['Журнал контроля работы стерилизаторов воздушного, парового (ф. 257/у).', 'Записывают: дату, тип и номер стерилизатора, вид изделий и упаковки, количество, режим (температура, давление, время), время начала и окончания.', 'Результаты химического контроля — вклеивают индикатор или отмечают изменение цвета; бакконтроль — по датам.', 'Подпись медсестры, проводившей стерилизацию.'],
    full: [['table', ['Графа журнала (ф. 257/у)', 'Пример заполнения'], [
      ['Дата', '09.11.2026'],
      ['Стерилизатор (марка, №)', 'ГП-400, № 2 (паровой)'],
      ['Наименование изделий, упаковка', 'перевязочный материал, бельё; биксы КСК-18 без фильтра'],
      ['Количество единиц', '4 бикса'],
      ['Режим стерилизации', '132 °C, 2 атм, 20 мин'],
      ['Время начала / окончания', '10:00 / 10:40'],
      ['Результат химического контроля', 'индикаторы изменили цвет согласно эталону (вклеить индикатор)'],
      ['Результат бактериологического контроля', 'по датам контроля'],
      ['Подпись', 'медсестра, проводившая стерилизацию'],
    ]]] },
  { n: 14, q: 'Приготовить материал для стерилизации и осуществить укладку в бикс', lec: ['sd-6'],
    short: ['Материал осмотреть (дыры заштопать, завязки пришить); простыни, халаты, полотенца скатать в рыхлые рулоны; салфетки стопками, шарики — в марлевой салфетке.', 'Бикс проверить, открыть отверстия, выстелить простынёй.', 'Укладывать вертикально, рыхло, послойно; индикаторы — вверху, в центре, внизу.', 'Закрыть краями простыни и крышкой, бирка (отделение, содержимое, дата, подпись); после стерилизации закрыть отверстия.'],
    full: [['h', 'Подготовка материала'], ['ul', ['халаты, простыни, полотенца тщательно осмотреть: дырки заштопать, оторванные завязки пришить;', 'простыню расстелить, с узкого конца загнуть на 50 см, сложить вчетверо продольно и скатать в рыхлый рулон;', 'халат сложить продольно рукавами и завязками внутрь, пояс — в правый карман, скатать рулоном с подола;', 'полотенца сложить пополам и скатать в рулон;', 'салфетки — стопками по 10–20 штук, шарики — завернуть в марлевую салфетку.']], ['h', 'Укладка'], ['ol', ['Проверить исправность бикса, открыть боковые отверстия.', 'На дно и стенки — развёрнутая простыня, концы наружу.', 'Укладывать <b>рыхло, послойно, вертикально</b> (параллельно движению пара), не касаясь крышки.', 'Индикаторы — в верхнюю, центральную и нижнюю части.', 'Завернуть края простыни, закрыть крышку, закрепить; бирка — отделение, материал, количество; после стерилизации — дата и подпись.']], X.store] },
  { n: 15, q: 'Размещение индикаторов в стерилизаторах в соответствии с инструкцией по применению и нормативными актами', lec: ['sd-6'],
    short: ['Используют химические (термохимические) индикаторы для нужного метода и режима.', 'Наружные — на каждую упаковку; внутренние — внутрь упаковки: в бикс не менее 3 (вверх, центр, низ), при секторальной укладке — в каждый сектор.', 'Бельё, марля — в середину изделия; трубчатые изделия, перчатки — внутрь полостей; плёнки — между слоями.', 'В камере — в контрольные точки по схеме инструкции; после цикла сверить цвет с эталоном (цвет как у эталона или темнее), результат — в журнал.'],
    full: [['ul', ['Выбрать индикатор, соответствующий методу (паровой/воздушный) и режиму (132/120 °C; 180/160 °C).', '<b>Наружные</b> индикаторы — на каждую упаковку/бикс: показывают, что изделие прошло цикл.', '<b>Внутренние</b> — внутрь упаковки: в стерилизационную коробку не менее <b>трёх</b> (вверху, в центре, внизу); при секторальной укладке — не менее одного в каждый сектор.', 'Простыни, одежда, марля — индикатор в середину изделия; сосуды, трубки, перчатки — внутрь полостей; полимерные плёнки и клеёнка — между складками.', 'При контроле работы стерилизатора индикаторы раскладывают в <b>контрольные точки</b> камеры по схеме из инструкции (в зависимости от объёма камеры).', 'После стерилизации сравнить цвет с эталоном: цвет как у эталона или темнее — режим соблюдён; светлее — стерилизация неэффективна, партию стерилизуют повторно.', 'Результат — в журнал контроля работы стерилизатора (можно вклеить индикатор).']]] },
  { n: 16, q: 'Обработка посуды терапевтического отделения', lec: [],
    short: ['Механически удалить остатки пищи в специальную ёмкость.', 'Вымыть в 1-м гнезде с моющим средством (вода около 45–50 °C), ополоснуть во 2-м горячей водой (не ниже 65 °C).', 'Просушить на решётках; хранить в закрытых шкафах.', 'При инфекционных заболеваниях и по эпидпоказаниям — дезинфекция посуды (погружение в дезраствор или кипячение); ветошь — дезинфекция и сушка.'],
    full: [['ol', ['Надеть халат «для раздачи пищи» / фартук, перчатки.', 'Механически удалить остатки пищи щёткой или лопаткой в ёмкость для пищевых отходов.', 'Вымыть посуду в первом гнезде ванны щёткой или мочалкой с моющим средством при температуре воды 45–50 °C.', 'Ополоснуть во втором гнезде горячей проточной водой не ниже 65 °C (при трёх гнёздах: 2-е — мытьё с половинной дозой моющего, 3-е — ополаскивание).', 'Просушить на решётках или полках; хранить в закрытых шкафах.', 'При инфекционных заболеваниях (по эпидпоказаниям) — после удаления остатков пищи посуду дезинфицируют погружением в дезраствор по инструкции или кипячением, затем моют и ополаскивают; остатки пищи обеззараживают.', 'Ветошь для мытья посуды и столов после использования дезинфицируют, промывают, сушат и хранят отдельно.']]] },
  { n: 17, q: 'Правила использования медицинских перчаток', lec: ['sd-8'],
    short: ['Надевают после гигиенической обработки рук при любом контакте с кровью, биожидкостями, слизистыми, повреждённой кожей; стерильные — для инвазивных вмешательств.', 'Меняют после каждого пациента, при переходе от грязного участка к чистому и при повреждении; мыть и обрабатывать перчатки для повторного использования нельзя.', 'Перчатки не заменяют обработку рук — после снятия обязательно гигиеническая обработка.', 'Снимают, выворачивая наизнанку, утилизируют как отходы класса Б.'],
    full: [['ul', ['<b>Стерильные</b> перчатки — для операций, инвазивных манипуляций (катетеризация, пункции), работы со стерильным материалом; <b>нестерильные</b> (смотровые) — при риске контакта с кровью, биожидкостями, слизистыми, при уборке, работе с отходами и бельём.', 'Перед надеванием — гигиеническая обработка рук; ногти короткие, кольца сняты.', 'Одна пара — один пациент; менять при переходе от загрязнённого участка тела к чистому, при повреждении, при загрязнении.', 'Нельзя мыть перчатки и обрабатывать антисептиком для повторного использования.', 'В перчатках не касаться лица, ручек дверей, документов.', 'При проколе/разрыве перчатки — снять, обработать руки, при контакте с кровью — действовать по алгоритму аварийной ситуации.', 'Снимать, выворачивая наизнанку, не касаясь кожи наружной стороной; утилизировать как отходы класса Б; затем гигиеническая обработка рук.', 'При аллергии на латекс — нитриловые или виниловые перчатки.']]] },
  { n: 18, q: 'Провести экстренную профилактику при уколе использованной иглой', lec: ['sd-8'],
    short: ['Немедленно снять перчатки, вымыть руки с мылом под проточной водой.', 'Обработать руки 70% спиртом, смазать ранку 5% спиртовым раствором йода, заклеить пластырем.', 'Сообщить руководителю, записать в журнал учёта аварийных ситуаций, составить акт.', 'Обследование на ВИЧ, гепатиты B и C (себя и, с согласия, пациента); при риске ВИЧ — АРВТ в первые 2 ч, не позднее 72 ч; наблюдение 12 мес.'],
    full: [X.hivAcc, X.kit] },
  { n: 19, q: 'Оказать первую помощь при попадании дезинфицирующих средств на кожу и слизистые', lec: ['sd-5'],
    short: ['Кожа — обильно промыть проточной водой, смазать смягчающим кремом.', 'Глаза — промывать проточной водой или 2% раствором соды 10–15 мин; к окулисту при раздражении.', 'Слизистая рта и носа — прополоскать водой.', 'При отравлении парами — свежий воздух, полоскание, тёплое питьё; при проглатывании — вода с активированным углём, рвоту не вызывать.'],
    full: [X.dsFirstAid] },
  { n: 20, q: 'Тактика медицинской сестры при аварийной ситуации (порез кожных покровов во время выполнения инъекции)', lec: ['sd-8'],
    short: ['Прекратить манипуляцию (безопасно для пациента), снять перчатки.', 'Вымыть руки с мылом под проточной водой, обработать 70% спиртом, смазать рану 5% йодом, заклеить бактерицидным пластырем.', 'Сообщить старшей медсестре/руководителю, записать в журнал учёта аварийных ситуаций, акт о медицинской аварии.', 'Обследование на ВИЧ и гепатиты B, C (сразу и через 3, 6, 12 мес); по показаниям — АРВТ в первые 2 ч, не позднее 72 ч.'],
    full: [X.hivAcc, X.kit] },
  { n: 21, q: 'Приготовление рабочего раствора для проведения генеральной уборки в противотуберкулёзном ЛПУ', lec: ['sd-4', 'sd-5'],
    short: ['Выбрать средство с туберкулоцидной активностью (хлорсодержащие, кислородсодержащие, альдегиды и др.).', 'Взять концентрацию и экспозицию по режиму «туберкулёз» из инструкции (выше, чем для бактерий).', 'Рассчитать: средство = объём × % / 100; приготовить в СИЗ с респиратором.', 'Промаркировать ёмкость «Для генеральной уборки», указать средство, %, дату, подпись.'],
    full: [['ol', ['Выбрать дезсредство, обладающее <b>туберкулоцидной</b> активностью (микобактерии устойчивее обычных бактерий): хлорсодержащие, кислородсодержащие, альдегиды, отдельные композиции ЧАС с туберкулоцидным режимом.', 'По инструкции выбрать концентрацию и время экспозиции для режима «туберкулёз» при генеральной уборке.', 'Рассчитать: средство (мл) = объём (мл) × % / 100. Пример: требуется 3% раствор, 10 л → 300 мл средства + 9 700 мл воды.', 'Надеть СИЗ: халат, шапочка, резиновые перчатки, <b>респиратор</b>, очки, фартук.', 'В ёмкость налить воду, добавить средство, перемешать, закрыть крышкой.', 'Маркировка: «Для генеральной уборки», название, концентрация, дата и время, подпись.', 'Уборку проводить по алгоритму генуборки; отходы туберкулёзного отделения, загрязнённые мокротой, относятся к классу В.']]] },
  { n: 22, q: 'Сбор и дезинфекция медицинских отходов (одноразовые шприцы, системы для в/в вливаний, ватные шарики)', lec: ['sd-4'],
    short: ['Это отходы класса Б — обязательная дезинфекция, жёлтая упаковка.', 'Иглы — отсечь иглосъёмником в непрокалываемый контейнер; колпачки на иглы не надевать.', 'Шприцы и системы — разрезать/разобрать при необходимости, заполнить и погрузить в дезраствор (режим на вирусы); шарики — в отдельную ёмкость с дезраствором.', 'После экспозиции — в жёлтый пакет на 3/4, стяжка, маркировка; контейнер для острого менять не реже 72 ч.'],
    full: [['ol', ['Подготовить в начале смены: контейнер для острого с иглосъёмником, ёмкости-контейнеры с дезраствором (режим на гепатиты и ВИЧ) для шприцев, систем и ватных шариков, жёлтые пакеты.', 'Сразу после инъекции отсечь иглу иглосъёмником в непрокалываемый контейнер (не надевать колпачок, не снимать иглу руками).', 'Шприц заполнить дезраствором и погрузить в ёмкость полностью; системы для в/в вливаний — разрезать на фрагменты/заполнить раствором и погрузить.', 'Ватные шарики, салфетки — в отдельную ёмкость с дезраствором.', 'Выдержать экспозицию по инструкции.', 'Слить раствор, отходы поместить в одноразовый пакет <b>жёлтого цвета</b>, заполнить не более чем на 3/4, завязать биркой-стяжкой.', 'Маркировать: организация, подразделение, дата, ФИО ответственного; перенести в место временного хранения/контейнер класса Б.', 'Контейнер для острого заполнять на 3/4, менять не реже 72 ч; работать в СИЗ.']]] },
  { n: 23, q: 'Провести контроль качества предстерилизационной обработки медицинских инструментов на остатки крови', lec: ['sd-6'],
    short: ['На остатки крови — азопирамовая или амидопириновая проба.', 'Контроль 1% изделий каждого наименования (не менее 3), изделия комнатной температуры.', 'Реактив (азопирам + 3% H₂O₂ 1:1) — 2–3 капли или протирание тампоном; оценить в течение 1 мин: фиолетовое → розово-сиреневое = кровь.', 'Положительная — повторная ПСО всей партии; запись в журнал ф. 366/у.'],
    full: [X.psoCtrl, ['h', 'Ход азопирамовой пробы'], ['ol', ['Приготовить рабочий раствор азопирама (азопирам + 3% перекись водорода 1:1), проверить на пятне крови.', 'Нанести 2–3 капли на изделие или протереть тампоном; каналы — пипеткой/шприцем.', 'Учесть результат в течение 1 минуты.', 'Смыть реактив, изделия повторно обработать.', 'Записать результат в журнал ф. 366/у.']]] },
  { n: 24, q: 'Продемонстрировать правила использования и утилизации средств индивидуальной защиты', lec: ['sd-8'],
    short: ['Надевать после гигиенической обработки рук: халат → маска/респиратор → очки/щиток → перчатки.', 'Использовать по назначению и однократно; маску менять каждые 2–3 ч и при намокании; перчатки — после каждого пациента.', 'Снимать: перчатки → очки → халат (выворачивая) → маска за завязки; не касаться наружной поверхности.', 'Утилизировать как отходы класса Б (жёлтый пакет), затем гигиеническая обработка рук.'],
    full: [X.siz, ['h', 'Порядок'], ['ol', ['Гигиеническая обработка рук.', 'Надеть халат (завязать), маску/респиратор (плотно по лицу, проверить прилегание), очки/щиток, перчатки (поверх манжет халата).', 'Работать, не касаясь лица; при повреждении СИЗ — сменить.', 'Снять перчатки (наизнанку, не касаясь кожи), очки/щиток — за дужки, халат — выворачивая наружной стороной внутрь, маску — за завязки, не касаясь передней части.', 'Сбросить всё в пакет для отходов класса Б (жёлтый); многоразовые очки — в дезраствор.', 'Гигиеническая обработка рук.']]] },
  { n: 25, q: 'Продемонстрировать приготовление рабочего раствора для дезинфекции поверхностей', lec: ['sd-4', 'sd-5'],
    short: ['Выбрать средство и режим по инструкции для поверхностей.', 'Рассчитать: средство = объём × % / 100 (например, 0,5% на 5 л — 25 мл средства + 4 975 мл воды).', 'В СИЗ налить воду, добавить средство, перемешать, закрыть.', 'Маркировка: название, %, назначение «для поверхностей», дата, время, подпись; срок годности по инструкции.'],
    full: [['ol', ['Выбрать средство, разрешённое для дезинфекции поверхностей, и режим (бактерии/вирусы/грибы).', 'Рассчитать количество: средство = объём × % / 100; вода = объём − средство.', 'Надеть СИЗ: халат, перчатки, маску, очки.', 'В промаркированную ёмкость налить воду, мерной ёмкостью добавить средство (или растворить таблетки), перемешать.', 'Закрыть крышкой; маркировка: название, концентрация, «для дезинфекции поверхностей», дата, время, подпись.', 'Поверхности обрабатывать протиранием ветошью (или орошением без людей), соблюдая экспозицию; затем при необходимости смыть водой.']], ['table', ['Пример', 'Средство', 'Вода'], [['0,1% — 1 л', '1 мл', '999 мл'], ['0,5% — 5 л', '25 мл', '4 975 мл'], ['1% — 10 л', '100 мл', '9 900 мл'], ['2% — 5 л', '100 мл', '4 900 мл']]]] },
  { n: 26, q: 'Продемонстрировать видовую укладку бикса', lec: ['sd-6'],
    short: ['Видовая (специализированная) укладка — в бикс один вид материала: только халаты, только салфетки, только шарики и т. п.', 'Подготовить бикс: исправность, открыть отверстия, выстелить простынёй.', 'Уложить материал одного вида вертикально, рыхло; индикаторы — вверху, в центре, внизу.', 'Закрыть, бирка с указанием вида и количества материала, после стерилизации — дата и подпись.'],
    full: [['p', '<b>Видовая (специализированная) укладка</b> — в бикс укладывают один вид материала: отдельный бикс с халатами, с салфетками, с шариками и т. д. Используют в операционных с большим объёмом работы.'], ['ol', ['Проверить исправность бикса, обработать, открыть боковые отверстия.', 'Выстелить простынёй (края наружу).', 'Уложить материал одного вида вертикально и рыхло (салфетки — стопками по 10–20 шт., шарики — в марлевых мешочках).', 'Индикаторы — вверху, в центре и внизу.', 'Закрыть краями простыни, закрыть крышку, бирка: отделение, вид материала, количество; после стерилизации — дата, подпись.', 'После стерилизации закрыть отверстия.']]] },
  { n: 27, q: 'Продемонстрировать целенаправленную укладку бикса', lec: ['sd-6'],
    short: ['Целенаправленная укладка — в один бикс всё необходимое для конкретной манипуляции или операции (например, для катетеризации, перевязки, конкретной операции).', 'Подготовить бикс: исправность, отверстия открыты, простыня на дне.', 'Уложить материал в порядке использования вертикально и рыхло; индикаторы — вверху, в центре, внизу.', 'Закрыть, бирка с названием манипуляции, после стерилизации — дата и подпись.'],
    full: [['p', '<b>Целенаправленная укладка</b> — в бикс укладывают разный материал, необходимый для конкретной манипуляции или операции (например, бикс для резекции желудка, для перевязки, для катетеризации мочевого пузыря). Применяют для больших плановых операций.'], ['ol', ['Проверить исправность бикса, обработать, открыть отверстия.', 'Выстелить простынёй.', 'Уложить материал для данной манипуляции в порядке использования: сверху то, что понадобится первым; рыхло и вертикально.', 'Индикаторы — вверху, в центре и внизу.', 'Закрыть, бирка: отделение, название манипуляции/операции, содержимое; после стерилизации — дата и подпись.']]] },
  { n: 28, q: 'Провести экстренную профилактику при попадании крови на одежду медицинской сестры', lec: ['sd-8'],
    short: ['Немедленно снять загрязнённую одежду (халат, костюм), не касаясь чистых участков кожи.', 'Погрузить одежду в дезраствор (или в бикс/бак для автоклавирования).', 'Кожу под загрязнённым участком обработать 70% спиртом, обмыть водой с мылом, повторно спиртом; обувь — двукратно протереть ветошью с дезраствором.', 'Надеть чистую спецодежду; сообщить руководителю, записать в журнал аварийных ситуаций.'],
    full: [['ol', ['Надеть перчатки (если сняты), снять загрязнённую одежду, сворачивая загрязнённой стороной внутрь.', 'Погрузить в ёмкость с дезраствором (режим на вирусы) или поместить в бикс/бак для автоклавирования.', 'Если кровь попала на кожу — обработать 70% спиртом, обмыть водой с мылом и повторно обработать 70% спиртом.', 'Загрязнённую обувь двукратно протереть ветошью, смоченной в дезрастворе.', 'Обработать руки, надеть чистую спецодежду.', 'Сообщить руководителю, зарегистрировать в журнале учёта аварийных ситуаций; при контакте с кожей/слизистыми — обследование на ВИЧ и гепатиты.']]] },
  { n: 29, q: 'Продемонстрировать алгоритм снятия и надевания стерильных перчаток', lec: ['sd-8'],
    short: ['Надевание: обработать руки; проверить упаковку и срок; вскрыть, взять первую перчатку за отворот (внутреннюю сторону) и надеть.', 'Пальцы руки в перчатке завести под отворот второй (наружная сторона) и надеть; расправить отвороты, не касаясь кожи; руки держать выше пояса.', 'Снятие: пальцами одной руки в перчатке взять другую снаружи у запястья, снять наизнанку, держать в руке.', 'Пальцы голой руки завести под край второй перчатки изнутри, снять, вывернув на первую; сбросить в отходы класса Б; гигиеническая обработка рук.'],
    full: [['h', 'Надевание стерильных перчаток'], ['ol', ['Снять кольца, провести гигиеническую обработку рук, дождаться высыхания антисептика.', 'Проверить размер, целостность упаковки и срок годности.', 'Вскрыть наружную упаковку, выложить внутреннюю на чистую поверхность и развернуть, не касаясь перчаток.', 'Левой рукой взять правую перчатку за отворот (касаться только внутренней стороны), ввести правую руку и надеть.', 'Пальцы правой руки в перчатке завести под отворот левой перчатки (наружная сторона), надеть её на левую руку.', 'Расправить отвороты, не касаясь кожи; поправить пальцы.', 'Руки в стерильных перчатках держать перед собой выше пояса, ничего нестерильного не касаться.']], ['h', 'Снятие перчаток'], ['ol', ['Пальцами правой руки в перчатке взять левую перчатку за наружную поверхность у запястья.', 'Снять её, выворачивая наизнанку; держать в правой руке.', 'Пальцы левой (голой) руки завести под отворот правой перчатки изнутри.', 'Снять правую перчатку, выворачивая её наизнанку и заключая в неё левую.', 'Сбросить в пакет для отходов класса Б.', 'Провести гигиеническую обработку рук.']]] },
  ],

/* ===== расписание ===== */
const DAY_SHORT = ['Пн','Вт','Ср','Чт','Пт','Сб'], DAY_FULL = ['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
const MON_GEN = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
function schedSubj(name){
  const n = name.toLowerCase();
  if (n.includes('микробиол') || n.includes('иммунол')) return SUBJ.immunology;
  if (n.includes('генетик')) return SUBJ.genetics;
  if (n.includes('анатом')) return SUBJ.anatomy;

}
const schedStyle = name => { const s = schedSubj(name); return s ? { c:s.color, ci:s.ink, cs:s.soft, em:s.emoji, id:s.id } : name.toLowerCase().includes('истори') ? { c:'#c2891c', ci:'#7a5208', cs:'#fff4dc', em:'📜' } : { c:'#7a7f99', ci:'#3d4160', cs:'#eef0f6', em:'📘' }; };
const toMin = t => { const [h,m] = t.split(':').map(Number); return h*60+m; };
function schedDate(i){ const d = new Date(SCHEDULE.monday+'T00:00:00'); d.setDate(d.getDate()+i); return d; }
function schedWeekLabel(){ const a = schedDate(0), b = schedDate(5); return a.getMonth()===b.getMonth() ? `${a.getDate()}–${b.getDate()} ${MON_GEN[b.getMonth()]}` : `${a.getDate()} ${MON_GEN[a.getMonth()]} – ${b.getDate()} ${MON_GEN[b.getMonth()]}`; }
function schedToday(){ // индекс дня недели расписания для сегодняшней даты, или -1
  const now = new Date(); const d0 = schedDate(0); const diff = Math.floor((new Date(now.getFullYear(),now.getMonth(),now.getDate()) - d0) / 864e5);
  return diff >= 0 && diff <= 5 ? diff : diff === 6 ? -2 /* воскресенье после недели */ : diff > 6 ? -3 /* неделя прошла */ : -4 /* ещё не началась */;
