<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" width="640" height="310" role="img" aria-label="Частоты генотипов"><title>Частоты генотипов</title><rect width="640" height="310" rx="20" fill="#edf6f3"/><g font-family="DejaVu Sans, sans-serif" fill="#143c38"><text x="25" y="40" font-size="26" font-weight="bold">Как из частот аллелей получить генотипы</text><text x="31" y="82" font-size="19" >Аллель от одного родителя</text><text x="333" y="82" font-size="20" font-weight="bold">A (p)</text><text x="485" y="82" font-size="20" font-weight="bold">a (q)</text><rect x="287" y="96" width="145" height="65" rx="7" fill="#c2e3db"/><text x="308" y="137" font-size="22" font-weight="bold">AA · p²</text><rect x="437" y="96" width="145" height="65" rx="7" fill="#f4dfbb"/><text x="458" y="137" font-size="22" font-weight="bold">Aa · pq</text><rect x="287" y="166" width="145" height="65" rx="7" fill="#f4dfbb"/><text x="308" y="207" font-size="22" font-weight="bold">Aa · pq</text><rect x="437" y="166" width="145" height="65" rx="7" fill="#d2deed"/><text x="458" y="207" font-size="22" font-weight="bold">aa · q²</text><text x="32" y="136" font-size="18" >Другой родитель: A (p)</text><text x="32" y="206" font-size="18" >Другой родитель: a (q)</text><text x="29" y="269" font-size="23" >Две клетки Aa дают 2pq — долю гетерозигот.</text></g></svg>